name: Publish NANO POS v1.0.83 — Sales, Analytics and Reminder
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-sales-fix-v1083.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nano-pos-v1083-sales-fix
  cancel-in-progress: false
jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch verified v1.0.82 base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          gh release download v1.0.82 --repo "$GITHUB_REPOSITORY" --pattern 'NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip' --dir /tmp/release
          echo '3ba23338aa95d487e917a79a1cc72f517e3bf528957c330efe43e20a6afcaff8  /tmp/release/NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip' | sha256sum -c
          unzip -q /tmp/release/NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip payload/app.asar -d /tmp/release/base
          echo '437ab513cd7ce6b5314b9c8c825f9d0e6efca2199598ffa7c5ed2bb3a83f318f  /tmp/release/base/payload/app.asar' | sha256sum -c
      - name: Apply and test corrected invoice amendment and analytics
        run: |
          set -euo pipefail
          npm install --prefix /tmp/asar-cli --no-audit --no-fund --no-save @electron/asar@3.4.1
          npm install --prefix /tmp/testkit --no-audit --no-fund --no-save jsdom@25.0.1 css-tree@3.1.0
          ASAR=/tmp/asar-cli/node_modules/.bin/asar
          "$ASAR" extract /tmp/release/base/payload/app.asar /tmp/release/source
          cp /tmp/release/source/electron-main.cjs /tmp/release/original-main.cjs
          cp /tmp/release/source/nano-cash-change.js /tmp/release/original-cash.js
          cp /tmp/release/source/nano-notifications.js /tmp/release/original-notifications.js
          node release/sales-fix-v1.0.83/apply.js /tmp/release/source
          for n in browser-bridge.js renderer.js nano-product-analytics.js faith-items.js nano-faith-login.js; do
            node --check "/tmp/release/source/$n"
          done
          cmp /tmp/release/original-main.cjs /tmp/release/source/electron-main.cjs
          cmp /tmp/release/original-cash.js /tmp/release/source/nano-cash-change.js
          cmp /tmp/release/original-notifications.js /tmp/release/source/nano-notifications.js
          node release/sales-fix-v1.0.83/test.js /tmp/release/source
          node - <<'JS'
          const fs=require('fs'),assert=require('assert'),css=require('/tmp/testkit/node_modules/css-tree');
          const base='/tmp/release/source/';
          const h=fs.readFileSync(base+'index.html','utf8');
          const source=fs.readFileSync(base+'renderer.js','utf8');
          const backend=fs.readFileSync(base+'browser-bridge.js','utf8');
          const pkg=JSON.parse(fs.readFileSync(base+'package.json','utf8'));
          assert.equal(pkg.version,'1.0.83');
          assert(source.includes('_0x1ebf74.editSaleId=currentEditSaleId'));
          assert(backend.includes("if (channel === 'process-sale' && args[0]?.editSaleId != null)"));
          assert(backend.includes("if (channel === 'get-product-analytics')"));
          assert(backend.includes('sale_edit_audit.unshift'));
          for(const id of ['productAnalyticsModal','salesHistoryTableBody','loginOverlay'])assert(h.includes('id="'+id+'"'));
          for(const name of ['nano-product-analytics.js','nano-faith-login.js','faith-items.js','nano-faith-login.css'])assert(h.includes(name));
          assert(css.parse(fs.readFileSync(base+'nano-faith-login.css','utf8')).children.size>5);
          console.log('PASS original structure, backend edit/analytics, sourced login modal, existing settings');
          JS
          mkdir -p /tmp/release/payload
          "$ASAR" pack /tmp/release/source /tmp/release/payload/app.asar
          node - <<'JS'
          const asar=require('/tmp/asar-cli/node_modules/@electron/asar');
          const file='/tmp/release/payload/app.asar';
          const pkg=JSON.parse(asar.extractFile(file,'package.json').toString());
          if(pkg.version!=='1.0.83')throw Error('Packaged version mismatch');
          for(const n of ['nano-product-analytics.js','nano-faith-login.js','faith-items.js'])if(!asar.extractFile(file,n).length)throw Error('Missing packaged feature '+n);
          JS
          (cd /tmp/release && zip -q -6 'NANO-POS-Patch-1.0.82-to-1.0.83-SALES-ANALYTICS-FAITH.zip' payload/app.asar)
          unzip -t /tmp/release/NANO-POS-Patch-1.0.82-to-1.0.83-SALES-ANALYTICS-FAITH.zip
          sha256sum /tmp/release/payload/app.asar /tmp/release/NANO-POS-Patch-1.0.82-to-1.0.83-SALES-ANALYTICS-FAITH.zip
      - name: Publish verified v1.0.83 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          file=/tmp/release/NANO-POS-Patch-1.0.82-to-1.0.83-SALES-ANALYTICS-FAITH.zip
          if gh release view v1.0.83 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p /tmp/release/prior
            gh release download v1.0.83 --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir /tmp/release/prior
            cmp "$file" "/tmp/release/prior/$(basename "$file")"
          else
            gh release create v1.0.83 "$file" --repo "$GITHUB_REPOSITORY" --title 'NANO POS v1.0.83 — إصلاح الفواتير والتحليلات' --notes 'تعديل الفاتورة الأصلية دون تكرار عملية البيع، إصلاح تحليلات المنتج، وإضافة نافذة آية أو حديث بمصدر موثوق بعد الدخول.'
          fi
          gh release view v1.0.83 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'NANO-POS-Patch-1.0.82-to-1.0.83-SALES-ANALYTICS-FAITH.zip'
      - name: Activate automatic update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 release/sales-fix-v1.0.83/update_manifest.py
