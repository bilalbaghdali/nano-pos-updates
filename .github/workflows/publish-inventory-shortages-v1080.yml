name: Publish NANO POS v1.0.80 — Inventory shortage list

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-inventory-shortages-v1080.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nano-pos-shortages-v1080
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and verify previous published NANO POS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          gh release download v1.0.79 --repo "$GITHUB_REPOSITORY" \
            --pattern 'NANO-POS-Patch-1.0.78-to-1.0.79-NOVA-COLORS.zip' --dir /tmp/release
          echo '1a6a23b07ad9a134e430be7957f0c125705b46a00e9d994dd207b8332ca01194  /tmp/release/NANO-POS-Patch-1.0.78-to-1.0.79-NOVA-COLORS.zip' | sha256sum -c
          unzip -q /tmp/release/NANO-POS-Patch-1.0.78-to-1.0.79-NOVA-COLORS.zip 'payload/app.asar' -d /tmp/release/base
          echo 'c5e63005c4f31d0a204dd340db3ff6f234cfbfd1866be4663d7970bee82bcdbb  /tmp/release/base/payload/app.asar' | sha256sum -c
      - name: Add low stock inventory button and run functional UI tests
        run: |
          set -euo pipefail
          npm install --prefix /tmp/asar-cli --no-audit --no-fund --no-save @electron/asar@3.4.1
          npm install --prefix /tmp/ui-test --no-audit --no-fund --no-save jsdom@25.0.1 css-tree@3.1.0
          ASAR=/tmp/asar-cli/node_modules/.bin/asar
          "$ASAR" extract /tmp/release/base/payload/app.asar /tmp/release/source
          for src in renderer.js browser-bridge.js nano-restock-assistant.js nano-cash-change.js nano-fast-pos.js nano-sales-layout.js nano-nova-desktop.css; do
             cp "/tmp/release/source/$src" "/tmp/release/unchanged-$src"
          done
          node release/shortages-v1.0.80/apply.js /tmp/release/source
          node --check /tmp/release/source/nano-inventory-shortages.js
          node --check /tmp/release/source/nano-restock-assistant.js
          node --check /tmp/release/source/renderer.js
          node --check /tmp/release/source/browser-bridge.js
          for src in renderer.js browser-bridge.js nano-restock-assistant.js nano-cash-change.js nano-fast-pos.js nano-sales-layout.js nano-nova-desktop.css; do
             cmp "/tmp/release/source/$src" "/tmp/release/unchanged-$src"
          done
          node - <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict');
          const csstree=require('/tmp/ui-test/node_modules/css-tree');
          const root='/tmp/release/source/',css=fs.readFileSync(root+'nano-inventory-shortages.css','utf8');
          const ast=csstree.parse(css,{onParseError:error=>{throw error}});
          assert(ast.children.size>10,'Missing responsive stylesheet rules');
          assert(css.includes('#productsSection .nano-shortage-open'),'Toolbar button style missing');
          assert(css.includes('.nano-shortage-scroll'),'Scrolling list style missing');
          const html=fs.readFileSync(root+'index.html','utf8');
          assert(html.includes('src="nano-restock-assistant.js"'),'Original stock helper missing');
          assert(html.includes('src="nano-inventory-shortages.js"'),'New list script missing');
          assert(html.includes('href="nano-inventory-shortages.css"'),'Missing new theme');
          assert(html.indexOf('nano-restock-assistant.js')<html.indexOf('nano-inventory-shortages.js'),'Helper loaded after new list');
          const pkg=JSON.parse(fs.readFileSync(root+'package.json','utf8'));
          assert.equal(pkg.version,'1.0.80');
          JS
          node release/shortages-v1.0.80/test.js /tmp/release/source
          mkdir -p /tmp/release/payload
          "$ASAR" pack /tmp/release/source /tmp/release/payload/app.asar
          node - <<'JS'
          const asar=require('/tmp/asar-cli/node_modules/@electron/asar');
          const p='/tmp/release/payload/app.asar';
          const pkg=JSON.parse(asar.extractFile(p,'package.json').toString('utf8'));
          if(pkg.version!=='1.0.80')throw Error('Packaged version incorrect');
          for(const x of ['nano-inventory-shortages.js','nano-inventory-shortages.css'])
             if(!asar.extractFile(p,x).length)throw Error('Missing file '+x);
          const html=asar.extractFile(p,'index.html').toString('utf8');
          if(!html.includes('nano-inventory-shortages.js'))throw Error('Shortcut not included in installer');
          JS
          (cd /tmp/release && zip -q -6 'NANO-POS-Patch-1.0.79-to-1.0.80-INVENTORY-SHORTAGES.zip' payload/app.asar)
          unzip -t /tmp/release/NANO-POS-Patch-1.0.79-to-1.0.80-INVENTORY-SHORTAGES.zip
          sha256sum /tmp/release/payload/app.asar /tmp/release/NANO-POS-Patch-1.0.79-to-1.0.80-INVENTORY-SHORTAGES.zip
      - name: Publish NANO POS v1.0.80 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.0.80 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
             mkdir -p /tmp/release/check
             gh release download v1.0.80 --repo "$GITHUB_REPOSITORY" \
               --pattern 'NANO-POS-Patch-1.0.79-to-1.0.80-INVENTORY-SHORTAGES.zip' --dir /tmp/release/check
             cmp /tmp/release/NANO-POS-Patch-1.0.79-to-1.0.80-INVENTORY-SHORTAGES.zip \
               /tmp/release/check/NANO-POS-Patch-1.0.79-to-1.0.80-INVENTORY-SHORTAGES.zip
          else
             gh release create v1.0.80 /tmp/release/NANO-POS-Patch-1.0.79-to-1.0.80-INVENTORY-SHORTAGES.zip \
               --repo "$GITHUB_REPOSITORY" --title 'NANO POS v1.0.80 — اقتراح المنتجات الناقصة' \
               --notes 'زر المنتجات الناقصة في واجهة المخزون، قائمة اقتراح الشراء، الطباعة وتصدير CSV والنسخ والإرسال عبر واتساب والبريد، دون تعديل كميات المخزون.'
          fi
          gh release view v1.0.80 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            grep -Fx 'NANO-POS-Patch-1.0.79-to-1.0.80-INVENTORY-SHORTAGES.zip'
      - name: Activate verified automatic update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 release/shortages-v1.0.80/update_manifest.py
