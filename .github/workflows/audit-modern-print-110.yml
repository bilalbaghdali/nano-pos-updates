name: Audit NANO POS v1.0.109 print architecture
on:
  push:
    branches: [feature/modern-print-layouts-110]
    paths: ['.github/workflows/audit-modern-print-110.yml','development/print/extract-reference-110.py']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Download authoritative current ASAR and audit printing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download v1.0.109 --pattern NANO-POS-Patch-1.0.108-to-1.0.109-PAYMENT-LABEL.zip --dir source
          python3 development/print/audit-print-architecture-110.py
          python3 development/print/extract-reference-110.py
      - name: Commit source-only excerpts for targeted development
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add development/print/print-architecture-audit-110.txt development/print/reference-110/
          git commit -m 'audit: verified original print center and template references'
          git push origin HEAD:refs/heads/feature/modern-print-layouts-110
