name: Inspect v1.0.56 desktop package for mobile-download update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mobile-download-v157.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect previous release structure without changing it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p base
          gh release download v1.0.56 --repo bilalbaghdali/nano-pos-updates --pattern '*.zip' --dir base
          python3 - <<'PY'
          import os,zipfile,hashlib,json,struct
          from pathlib import Path
          z=next(Path('base').glob('*.zip'))
          print('ZIP name:',z.name, 'bytes',z.stat().st_size)
          with zipfile.ZipFile(z) as a:
            infos=a.infolist()
            print('ZIP files',[(k.filename,k.file_size) for k in infos[:30]])
            candidates=[k for k in infos if k.filename.endswith('.asar')]
            for candidate in candidates[:2]:
              data=a.read(candidate)
              print('ASAR file',candidate.filename,'bytes',len(data),'sha256',hashlib.sha256(data).hexdigest())
              for hint in [4,12]:
                try: print('Header int offset',hint,struct.unpack_from('<I',data,hint))
                except: pass
              try:
                header=json.loads(data[16:16+struct.unpack_from('<I',data,12)[0]])
                print('ASAR TOP LEVEL',list(header.get('files',{}).keys())[:80])
                files=header['files']
                for p in ['index.html','server.cjs','package.json','mobile-download.js','mobile/index.html']:
                  node=files
                  try:
                    for part in p.split('/'): node=node['files'][part]
                  except Exception as e:
                    print('MISSING',p)
                    continue
                  start=8+struct.unpack_from('<I',data,4)[0]+int(node['offset'])
                  buf=data[start:start+node['size']]
                  print('FOUND',p,'size',len(buf))
                  if p in ['index.html','server.cjs']:
                    txt=buf.decode('utf-8','replace')
                    for needle in ['lumina.fikradevs.com/download','settingsTab-mobileapp','appDownloadSection','mobileApkDownloadButton','createServer']:
                      print('TEXT',p,needle,txt.find(needle))
                    if p=='index.html':
                      pos=txt.find('lumina.fikradevs.com/download')
                      if pos!=-1: print('HTML AROUND',txt[pos-250:pos+600])
                    if p=='server.cjs':print('SERVER HEADER',txt[:400])
              except Exception as e: print('ASAR read fail',str(e))
          PY