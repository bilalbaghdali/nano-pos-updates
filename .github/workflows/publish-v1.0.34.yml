name: Publish NANO POS v1.0.34

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.0.34.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v1.0.34 tool bundle
        run: |
          sha256sum tools/.tmp-v134-bundle-00 tools/.tmp-v134-bundle-01 tools/.tmp-v134-bundle-02 tools/.tmp-v134-bundle-03
          cat tools/.tmp-v134-bundle-00 tools/.tmp-v134-bundle-01 tools/.tmp-v134-bundle-02 tools/.tmp-v134-bundle-03 > tools/v134-tools.tar.gz.b64
          echo "7280be4bf2cad0985bb060c264f179a295d552ad76f5c0c4ea15995a2deb0c18  tools/v134-tools.tar.gz.b64" | sha256sum -c -
          base64 -d tools/v134-tools.tar.gz.b64 > tools/v134-tools.tar.gz
          echo "fbafa1a0d11f002fde960e974a07a51d54687474fc74abd464acac90588fd3e1  tools/v134-tools.tar.gz" | sha256sum -c -
          tar -xzf tools/v134-tools.tar.gz -C tools
          mv tools/nano-v134-core.js tools/.tmp-core-v134.js
          mv tools/document-print-preview-v134.js tools/.tmp-preview-v134.js
          mv tools/build_v134_github.py tools/.tmp-patch-v134.py
          echo "43cc29d77ce4bf66379a6f1d4931646f8b868ad55acf3009d04064d0f08de841  tools/.tmp-core-v134.js" | sha256sum -c -
          echo "0c4491a8a7e0a02fdf830160d21d493b8f90057a9eeb93f9be2149432965453e  tools/.tmp-preview-v134.js" | sha256sum -c -
          echo "213422b52172eaa13b471c439dc98b10d6649ed014f24addeeb1f5b9900adfdb  tools/.tmp-patch-v134.py" | sha256sum -c -

      - name: Download v1.0.33 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download v1.0.33 --repo "$GITHUB_REPOSITORY" --pattern "NANO-POS-Patch-1.0.32-to-1.0.33-FULL-INVOICE-LANGUAGE-PC-IP-FIX.zip" --dir work
          cd work
          unzip -o NANO-POS-Patch-1.0.32-to-1.0.33-FULL-INVOICE-LANGUAGE-PC-IP-FIX.zip
          test -f payload/app.asar
          echo "0d0022d87d8211f468aade66a3f7840f28a2982a90f030a13041ede521253819  payload/app.asar" | sha256sum -c -

      - name: Build and verify v1.0.34
        run: |
          cp tools/.tmp-patch-v134.py work/patch.py
          cd work
          python patch.py
          echo "5c883d648c60c81468d1648e254ad0f65b8f71f9ab2d05ca657faba3c6160bc0  payload/app.asar" | sha256sum -c -
          touch -t 202610071521 payload/app.asar
          zip -X -9 NANO-POS-Patch-1.0.33-to-1.0.34-PRINT-SYNC-CURRENCY.zip payload/app.asar
          echo "2ea92ed65a3964f3fedb24593c9553630f0ae93c5acb1b49d58457b72b15ea1c  NANO-POS-Patch-1.0.33-to-1.0.34-PRINT-SYNC-CURRENCY.zip" | sha256sum -c -

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd work
          if gh release view v1.0.34 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.34 NANO-POS-Patch-1.0.33-to-1.0.34-PRINT-SYNC-CURRENCY.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.0.34 NANO-POS-Patch-1.0.33-to-1.0.34-PRINT-SYNC-CURRENCY.zip               --repo "$GITHUB_REPOSITORY" --target main --title "NANO POS v1.0.34"               --notes "مركز طباعة موحد مع اختيار الطابعة والورق وعدد النسخ والألوان واختبار الطباعة، اختبار اتصال الكمبيوتر مع زمن الاستجابة والإصدار قبل الربط، ونظام مركزي قابل للتخصيص لتنسيق العملة في الفواتير والوصول والباركود والملصقات."
          fi
