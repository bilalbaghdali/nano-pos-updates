name: Inspect NANO POS v1.0.38 for bundled mobile APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-v138-mobile-embed.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect verified historical release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          gh release download v1.0.38 --pattern 'NANO-POS-Patch-1.0.37-to-1.0.38-DIRECT-MEGA.zip' --dir tmp
          python3 - <<'PY'
          import zipfile,hashlib,json,struct
          p='tmp/NANO-POS-Patch-1.0.37-to-1.0.38-DIRECT-MEGA.zip'
          buf=open(p,'rb').read()
          print('ZIP_SHA256',hashlib.sha256(buf).hexdigest())
          with zipfile.ZipFile(p) as z:asar=z.read('payload/app.asar')
          print('ASAR_SHA256',hashlib.sha256(asar).hexdigest())
          header=json.loads(asar[16:16+struct.unpack_from('<I',asar,12)[0]])
          off=8+struct.unpack_from('<I',asar,4)[0]
          def get(k):
            node=header
            for n in k.split('/'):node=node['files'][n]
            return asar[off+int(node['offset']):off+int(node['offset'])+node['size']]
          def around(s,sub,before=200,after=300):
            n=s.find(sub)
            return (str(n)+' '+s[max(0,n-before):n+len(sub)+after].replace('\n','\\n')) if n>=0 else '-1'
          for k in ['index.html','electron-main.cjs','electron-native-preload.cjs','mobile-sync-server.cjs','server.cjs','package.json','app-config.js','release-notes.js','mobile/www/index.html','nano-mobile-download.js']:
            try:raw=get(k)
            except Exception as e:
              print('MISSING',k,str(e)[:150]);continue
            s=raw.decode('utf8','replace')
            print('FILE',k,'size',len(raw))
            if k=='package.json':
              p=json.loads(s);print('PACKAGE',p.get('version'),p.get('main'),p.get('build',{}).get('files',[])[:10])
            if k=='index.html':
              for x in ['id="appDownloadSection"','id="settingsTab-mobileapp"','lumina.fikradevs.com/download','</body>','renderer.js']:
                print('ANCHOR',k,x,around(s,x,160,500))
            if k in ['electron-main.cjs','electron-native-preload.cjs','mobile-sync-server.cjs','server.cjs']:
              markers={
                'electron-main.cjs':["const { createMobileSyncServer }", "registerUpdaterIpc(ipcMain);", "localServer = http.createServer((req, res) => {", "const { app, BrowserWindow", "const root = __dirname"],
                'electron-native-preload.cjs':["appVersion: APP_VERSION","contextBridge.exposeInMainWorld('nanoNative'","'nano-mobile-sync-info'"],
                'mobile-sync-server.cjs':["const crypto = require('node:crypto');","const { resolveCustomerRows }","async function handler(req, res)","server.listen(","function createMobileSyncServer"],
                'server.cjs':["const { trialState }","const server = http.createServer((req, res) => {"]
              }
              for x in markers[k]:print('ANCHOR',k,x,around(s,x,140,290))
            if k=='release-notes.js':
              for x in ['const F=']:print('ANCHOR',k,x,around(s,x,0,400))
            if k=='app-config.js':print('CONFIG_TAIL',s[-450:].replace('\n','\\n'))
          PY