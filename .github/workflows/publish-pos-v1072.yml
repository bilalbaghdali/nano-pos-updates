name: Publish NANO POS v1.0.72 — Digital price display

on:
  push:
    paths:
      - .github/workflows/publish-pos-v1072.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nano-pos-v1072-publish
  cancel-in-progress: false

jobs:
  build-verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve and verify NANO POS v1.0.71
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          gh release download v1.0.71 --repo "$GITHUB_REPOSITORY" \
            --pattern 'NANO-POS-Patch-1.0.70-to-1.0.71-DESKTOP-STOCKTAKE-FIX.zip' --dir /tmp/release
          echo '88c2ae0aef2e45b0cdfd1ab42d606b50a89b0d24333cc659b6a537b95ddbd95f  /tmp/release/NANO-POS-Patch-1.0.70-to-1.0.71-DESKTOP-STOCKTAKE-FIX.zip' | sha256sum -c
          unzip -q /tmp/release/NANO-POS-Patch-1.0.70-to-1.0.71-DESKTOP-STOCKTAKE-FIX.zip 'payload/app.asar' -d /tmp/release/base
          echo '65c33648c28ef7083264a0f8c700b4b0f14c2b6762e8d5c3ca42a745fd174f9a  /tmp/release/base/payload/app.asar' | sha256sum -c
      - name: Remove automatic checkout offers and build large digital total display
        run: |
          set -euo pipefail
          npm install --prefix /tmp/asar-cli --no-audit --no-fund --no-save @electron/asar@3.4.1
          ASAR=/tmp/asar-cli/node_modules/.bin/asar
          "$ASAR" extract /tmp/release/base/payload/app.asar /tmp/release/source
          node release/pos-v1.0.72/apply.js /tmp/release/source
          node --check /tmp/release/source/browser-bridge.js
          node --check /tmp/release/source/mobile/www/browser-bridge.js
          node --check /tmp/release/source/nano-price-display.js
          node - <<'JS'
          const fs = require('fs'), root='/tmp/release/source/';
          const main=fs.readFileSync(root+'index.html','utf8');
          const mobile=fs.readFileSync(root+'mobile/www/index.html','utf8');
          for (const html of [main,mobile]) {
            if (html.includes('src="nano-pricing-ui.js"')) throw Error('Legacy pricing toggle still loaded');
          }
          if (!main.includes('src="nano-price-display.js"') || !main.includes('href="nano-price-display.css"')) throw Error('Missing display assets');
          for (const file of ['browser-bridge.js','mobile/www/browser-bridge.js']) {
            const s=fs.readFileSync(root+file,'utf8');
            if (s.includes('NANO_PRICING_168.reprice(')) throw Error('Automatic checkout repricing still enabled: '+file);
            if (!s.includes('checkout:{...args[0].checkout,applyOffers:false}')) throw Error('Old clients could still request automatic pricing: '+file);
          }
          const pkg=JSON.parse(fs.readFileSync(root+'package.json','utf8'));
          if (pkg.version!=='1.0.72') throw Error('Wrong version '+pkg.version);
          JS
          mkdir -p /tmp/release/payload
          "$ASAR" pack /tmp/release/source /tmp/release/payload/app.asar
          node - <<'JS'
          const asar=require('/tmp/asar-cli/node_modules/@electron/asar');
          const p='/tmp/release/payload/app.asar';
          const pkg=JSON.parse(asar.extractFile(p,'package.json').toString('utf8'));
          if(pkg.version!=='1.0.72')throw Error('Packaged version mismatch');
          for(const file of ['nano-price-display.js','nano-price-display.css']) if(!asar.extractFile(p,file).length)throw Error('Missing '+file);
          const b=asar.extractFile(p,'browser-bridge.js').toString('utf8');
          if(b.includes('NANO_PRICING_168.reprice('))throw Error('Price adjustment still present in app.asar');
          JS
          (cd /tmp/release && zip -q -6 'NANO-POS-Patch-1.0.71-to-1.0.72-POS-DIGITAL-PRICE.zip' payload/app.asar)
          unzip -t /tmp/release/NANO-POS-Patch-1.0.71-to-1.0.72-POS-DIGITAL-PRICE.zip
          sha256sum /tmp/release/payload/app.asar /tmp/release/NANO-POS-Patch-1.0.71-to-1.0.72-POS-DIGITAL-PRICE.zip
      - name: Publish v1.0.72 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.0.72 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p /tmp/release/check
            gh release download v1.0.72 --repo "$GITHUB_REPOSITORY" \
              --pattern 'NANO-POS-Patch-1.0.71-to-1.0.72-POS-DIGITAL-PRICE.zip' --dir /tmp/release/check
            cmp /tmp/release/NANO-POS-Patch-1.0.71-to-1.0.72-POS-DIGITAL-PRICE.zip \
              /tmp/release/check/NANO-POS-Patch-1.0.71-to-1.0.72-POS-DIGITAL-PRICE.zip
          else
            gh release create v1.0.72 /tmp/release/NANO-POS-Patch-1.0.71-to-1.0.72-POS-DIGITAL-PRICE.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title 'NANO POS v1.0.72 — تحسينات عامة وشاشة سعر رقمية' \
              --notes 'إزالة تطبيق العروض وسعر الجملة تلقائيًا عند اعتماد البيع، مع عرض كبير للإجمالي بأرقام LED رقمية.'
          fi
          gh release view v1.0.72 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -Fx 'NANO-POS-Patch-1.0.71-to-1.0.72-POS-DIGITAL-PRICE.zip'
      - name: Activate automatic update after successful publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 release/pos-v1.0.72/update_manifest.py
