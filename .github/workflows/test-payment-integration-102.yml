name: NANO POS v1.0.102 - Mixed Payment Integration Gate
on:
  push:
    branches: ['feature/payment-ledger-102']
    paths:
      - 'development/trade/**'
      - '.github/workflows/test-payment-integration-102.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate official 1.0.101
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source work
          curl -fsSL https://raw.githubusercontent.com/bilalbaghdali/nano-pos-updates/main/nano-pos-update.json -o source/latest-manifest.json
          gh release download v1.0.101 --pattern NANO-POS-Patch-1.0.100-to-1.0.101-SUPPLIER-COST.zip --dir source
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,json,hashlib
          d=json.loads(Path('source/latest-manifest.json').read_text())
          assert d['version']=='1.0.101' and d['published']
          f=Path('source/NANO-POS-Patch-1.0.100-to-1.0.101-SUPPLIER-COST.zip')
          assert hashlib.sha256(f.read_bytes()).hexdigest()==d['patches'][0]['sha256']
          with zipfile.ZipFile(f) as z:
            assert z.namelist()==['payload/app.asar']
            assert hashlib.sha256(z.read('payload/app.asar')).hexdigest()==d['patches'][0]['appAsarSha256']
          PY
      - name: Build and test real browser bridge payments
        run: |
          set -euo pipefail
          python3 development/trade/build-payment-ledger-102.py \
            source/NANO-POS-Patch-1.0.100-to-1.0.101-SUPPLIER-COST.zip \
            NANO-POS-Patch-1.0.101-to-1.0.102-MIXED-PAYMENT.zip work
          for n in browser-bridge.js nano-payment-ledger-102.js nano-split-ui-102.js release-notes.js; do node --check "work/$n"; done
          cp development/trade/test-payment-ledger-102.cjs work/
          cp development/trade/test-payment-bridge-102.cjs work/
          cp development/trade/test-split-ui-102.cjs work/
          (cd work && node test-payment-ledger-102.cjs)
          (cd work && node test-payment-bridge-102.cjs)
          (cd work && npm install --ignore-scripts --no-save jsdom@26.1.0 && node test-split-ui-102.cjs)
          python3 - <<'PY'
          import zipfile,struct,json,hashlib
          from pathlib import Path
          with zipfile.ZipFile('NANO-POS-Patch-1.0.101-to-1.0.102-MIXED-PAYMENT.zip') as z:
            assert z.namelist()==['payload/app.asar'];data=z.read('payload/app.asar')
          magic,b,hs,n=struct.unpack_from('<4I',data);assert magic==4 and b==hs+4
          files=json.loads(data[16:16+n])['files']
          for name in ['browser-bridge.js','nano-payment-ledger-102.js','nano-split-ui-102.js','index.html','release-notes.js','package.json']:
            e=files[name];payload=data[8+b+int(e['offset']):8+b+int(e['offset'])+e['size']]
            assert payload==Path('work/'+name).read_bytes()
            if 'integrity' in e:assert hashlib.sha256(payload).hexdigest()==e['integrity']['hash']
          assert json.loads(Path('work/package.json').read_text())['version']=='1.0.102'
          print('PASS ASAR verification and version')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nano-pos-102-unreleased
          path: |
            NANO-POS-Patch-1.0.101-to-1.0.102-MIXED-PAYMENT.zip
            work/browser-bridge.js
            work/nano-payment-ledger-102.js
            work/nano-split-ui-102.js
            work/index.html
            work/release-notes.js
            work/package.json
            work/test-payment-ledger-102.cjs
            work/test-payment-bridge-102.cjs
            work/test-split-ui-102.cjs
          if-no-files-found: error
  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nano-pos-102-unreleased
      - name: Validate accounting, UI and failed storage rollback on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location work
          try{
            node --check browser-bridge.js
            node --check nano-payment-ledger-102.js
            node --check nano-split-ui-102.js
            node test-payment-ledger-102.cjs
            if($LASTEXITCODE -ne 0){throw 'payment model failed'}
            node test-payment-bridge-102.cjs
            if($LASTEXITCODE -ne 0){throw 'payment bridge failed'}
            npm install --ignore-scripts --no-save jsdom@26.1.0
            if($LASTEXITCODE -ne 0){throw 'jsdom installation failed'}
            node test-split-ui-102.cjs
            if($LASTEXITCODE -ne 0){throw 'payment UI failed'}
          }finally{Pop-Location}
  protected:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check user data, activation and updater were not changed on branch
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD
          if git diff --name-only origin/main...HEAD | grep -E '^(nano-pos-update\.json|app\.asar|mobile/|database/|activation/|backup/)' ; then
            echo 'Unexpected protected changes'; exit 1
          fi
