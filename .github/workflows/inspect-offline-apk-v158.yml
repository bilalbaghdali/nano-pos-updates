name: Inspect NANO POS v1.0.57 APK delivery paths
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-offline-apk-v158.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source routes and Electron API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p archive
          gh release download v1.0.57 --pattern '*.zip' --dir archive
          python3 - <<'PY'
          import zipfile,struct,json,re
          from pathlib import Path
          z=next(Path('archive').glob('*.zip'))
          with zipfile.ZipFile(z) as arc: data=arc.read('payload/app.asar')
          h=json.loads(data[16:16+struct.unpack_from('<I',data,12)[0]])
          start=8+struct.unpack_from('<I',data,4)[0]
          def get(path):
            n=h
            for p in path.split('/'):n=n['files'][p]
            return data[start+int(n['offset']):start+int(n['offset'])+n['size']].decode('utf8')
          def excerpt(text,term,before=4,after=12,limit=5):
            lines=text.splitlines()
            found=[i for i,line in enumerate(lines) if term.lower() in line.lower()]
            print('MATCH',term,'count',len(found))
            for i in found[:limit]:
              print('--- lines',i+1,'----')
              for no in range(max(0,i-before),min(len(lines),i+after)):print(f'{no+1}: {lines[no][:400]}')
          for path in ['electron-main.cjs','electron-native-preload.cjs','server.cjs','mobile-sync-server.cjs','browser-bridge.js','index.html','nano-mobile-download.js','mobile/www/index.html','package.json']:
            try: s=get(path)
            except:continue
            print('### FILE',path,'LEN',len(s),'LINES',len(s.splitlines()))
            if path in ['electron-main.cjs','electron-native-preload.cjs','server.cjs']:
              print('HEAD',s[:13000])
            elif path=='index.html':
              excerpt(s,'appDownloadSection',6,18,2)
              excerpt(s,'nano-mobile-download.js',3,3,1)
            elif path=='mobile/www/index.html':
              excerpt(s,'appDownloadSection',4,9,2)
            elif path=='nano-mobile-download.js':
              print(s[:9000])
            elif path=='mobile-sync-server.cjs':
              print('HEAD',s[:11000])
              for term in ['http.createServer','createServer(','listen(',"url.pathname",'req.url','mobile/index.html','mobile/www','bind','host','port','return {']:excerpt(s,term,5,15,5)
            elif path=='browser-bridge.js':
              for term in ['ipcRenderer','saveDialog','download','server','writeFile']:excerpt(s,term,2,5,2)
            elif path=='package.json':print(s[:2500])
            else:
              for term in ['createServer','http.createServer','mobile','download','listen(','express(']:excerpt(s,term,2,5,5)
          PY