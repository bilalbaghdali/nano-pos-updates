name: Publish NANO POS v1.0.73 — Responsive sales screen

on:
  push:
    paths:
      - .github/workflows/publish-pos-v1073.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nano-pos-v1073-publish
  cancel-in-progress: false

jobs:
  build-verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve verified v1.0.72 update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          gh release download v1.0.72 --repo "$GITHUB_REPOSITORY" \
            --pattern 'NANO-POS-Patch-1.0.71-to-1.0.72-POS-DIGITAL-PRICE.zip' --dir /tmp/release
          echo '14416c6bb85b7b82769cda4a44ebf02a4de51c7723d8c887ab10d6a00131c2b1  /tmp/release/NANO-POS-Patch-1.0.71-to-1.0.72-POS-DIGITAL-PRICE.zip' | sha256sum -c
          unzip -q /tmp/release/NANO-POS-Patch-1.0.71-to-1.0.72-POS-DIGITAL-PRICE.zip 'payload/app.asar' -d /tmp/release/base
          echo 'f386e9fdc741929b7a60d5749409bdb2bed9cab5c7896e9696cc1e4acf177e5f  /tmp/release/base/payload/app.asar' | sha256sum -c
      - name: Rebalance screen and digital total, keep sales logic unchanged
        run: |
          set -euo pipefail
          npm install --prefix /tmp/asar-cli --no-audit --no-fund --no-save @electron/asar@3.4.1
          npm install --prefix /tmp/css-check --no-audit --no-fund --no-save css-tree@3.1.0
          ASAR=/tmp/asar-cli/node_modules/.bin/asar
          "$ASAR" extract /tmp/release/base/payload/app.asar /tmp/release/source
          cp /tmp/release/source/nano-price-display.js /tmp/release/digital-original.js
          cp /tmp/release/source/browser-bridge.js /tmp/release/bridge-original.js
          cp release/pos-v1.0.73/nano-price-display.css /tmp/release/source/nano-price-display.css
          node - <<'JS'
          const fs=require('fs');
          const csstree=require('/tmp/css-check/node_modules/css-tree');
          const root='/tmp/release/source/';
          const css=fs.readFileSync(root+'nano-price-display.css','utf8');
          const ast=csstree.parse(css, {onParseError:e=>{throw e}});
          if (!ast.children.size) throw Error('Stylesheet empty');
          for(const term of ['@container (max-width:420px)', 'data-pos-layout="design2"',
              'data-pos-layout="design3"', 'pos-summary-total-row.nano-digital-enabled',
              'grid-template-columns:minmax(0,1fr) max-content', 'height:clamp(45px,13cqi,83px)']) {
            if (!css.includes(term)) throw Error('Responsive style missing: '+term);
          }
          const html=fs.readFileSync(root+'index.html','utf8');
          for(const id of ['posProductsPane','posCartContainer','posSummaryBar','cartTotal','posCheckoutBtn']) {
            if (!html.includes('id="'+id+'"')) throw Error('Missing POS element: '+id);
          }
          if(!html.includes('href="nano-price-display.css"') ||
             !html.includes('src="nano-price-display.js"')) throw Error('LED display not wired up');
          const pkg=JSON.parse(fs.readFileSync(root+'package.json','utf8'));
          if(pkg.version!=='1.0.72')throw Error('Unexpected baseline '+pkg.version);
          pkg.version='1.0.73';
          fs.writeFileSync(root+'package.json',JSON.stringify(pkg,null,2)+'\n');
          const lockPath=root+'package-lock.json';
          if(fs.existsSync(lockPath)){
            const lock=JSON.parse(fs.readFileSync(lockPath,'utf8'));
            lock.version='1.0.73';
            if(lock.packages&&lock.packages[''])lock.packages[''].version='1.0.73';
            fs.writeFileSync(lockPath,JSON.stringify(lock,null,2)+'\n');
          }
          JS
          cmp /tmp/release/digital-original.js /tmp/release/source/nano-price-display.js
          cmp /tmp/release/bridge-original.js /tmp/release/source/browser-bridge.js
          mkdir -p /tmp/release/payload
          "$ASAR" pack /tmp/release/source /tmp/release/payload/app.asar
          node - <<'JS'
          const asar=require('/tmp/asar-cli/node_modules/@electron/asar');
          const fs=require('fs');
          const p='/tmp/release/payload/app.asar';
          const pkg=JSON.parse(asar.extractFile(p,'package.json').toString('utf8'));
          if(pkg.version!=='1.0.73') throw Error('Packaged version invalid');
          if(!asar.extractFile(p,'nano-price-display.css').includes('max-width:100%'))throw Error('No responsive CSS in package');
          if(!asar.extractFile(p,'nano-price-display.js').equals(fs.readFileSync('/tmp/release/digital-original.js')))throw Error('Price script modified');
          if(!asar.extractFile(p,'browser-bridge.js').equals(fs.readFileSync('/tmp/release/bridge-original.js')))throw Error('Sales logic modified');
          JS
          (cd /tmp/release && zip -q -6 'NANO-POS-Patch-1.0.72-to-1.0.73-SALES-RESPONSIVE.zip' payload/app.asar)
          unzip -t /tmp/release/NANO-POS-Patch-1.0.72-to-1.0.73-SALES-RESPONSIVE.zip
          sha256sum /tmp/release/payload/app.asar /tmp/release/NANO-POS-Patch-1.0.72-to-1.0.73-SALES-RESPONSIVE.zip
      - name: Publish NANO POS v1.0.73 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.0.73 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p /tmp/release/check
            gh release download v1.0.73 --repo "$GITHUB_REPOSITORY" \
              --pattern 'NANO-POS-Patch-1.0.72-to-1.0.73-SALES-RESPONSIVE.zip' --dir /tmp/release/check
            cmp /tmp/release/NANO-POS-Patch-1.0.72-to-1.0.73-SALES-RESPONSIVE.zip \
              /tmp/release/check/NANO-POS-Patch-1.0.72-to-1.0.73-SALES-RESPONSIVE.zip
          else
            gh release create v1.0.73 /tmp/release/NANO-POS-Patch-1.0.72-to-1.0.73-SALES-RESPONSIVE.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title 'NANO POS v1.0.73 — تحسين تناسق شاشة البيع' \
              --notes 'تحسين تناسق شاشة البيع، تصغير وتنظيم شاشة عرض السعر الرقمية، وضبط السلة والأزرار لجميع تخطيطات البيع بدون تغيير حسابات البيع.'
          fi
          gh release view v1.0.73 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -Fx 'NANO-POS-Patch-1.0.72-to-1.0.73-SALES-RESPONSIVE.zip'
      - name: Activate verified automatic update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 release/pos-v1.0.73/update_manifest.py
