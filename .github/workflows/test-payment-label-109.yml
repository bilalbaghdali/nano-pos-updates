name: NANO POS v1.0.109 - Paid Amount Label Verification
on:
  push:
    branches: [fix/payment-label-109]
    paths:
      - '.github/scripts/build-payment-label-109.py'
      - '.github/scripts/test-payment-label-109.cjs'
      - '.github/workflows/test-payment-label-109.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official verified v1.0.108
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source work
          gh release download v1.0.108 --pattern NANO-POS-Patch-1.0.107-to-1.0.108-PARTIAL-CREDIT-CHANGE.zip --dir source
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          m=json.loads(Path('nano-pos-update.json').read_text())
          assert m['version']=='1.0.108' and m['published']
          p=Path('source/NANO-POS-Patch-1.0.107-to-1.0.108-PARTIAL-CREDIT-CHANGE.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['patches'][0]['sha256']
          with zipfile.ZipFile(p) as z:
            assert z.namelist()==['payload/app.asar']
            assert hashlib.sha256(z.read('payload/app.asar')).hexdigest()==m['patches'][0]['appAsarSha256']
          PY
      - name: Build 1.0.109 and run checkout regression
        run: |
          set -euo pipefail
          python3 .github/scripts/build-payment-label-109.py \
            source/NANO-POS-Patch-1.0.107-to-1.0.108-PARTIAL-CREDIT-CHANGE.zip \
            NANO-POS-Patch-1.0.108-to-1.0.109-PAYMENT-LABEL.zip work
          node --check work/browser-bridge.js
          node --check work/nano-flex-payment-108.js
          node --check work/nano-payment-quality-105.js
          cp .github/scripts/test-payment-label-109.cjs work/
          cp .github/scripts/test-flex-bridge-108.cjs work/
          (cd work && node test-payment-label-109.cjs && node test-flex-bridge-108.cjs)
          python3 - <<'PY'
          import zipfile,struct,json,hashlib
          from pathlib import Path
          z=zipfile.ZipFile('NANO-POS-Patch-1.0.108-to-1.0.109-PAYMENT-LABEL.zip')
          assert z.namelist()==['payload/app.asar']
          raw=z.read('payload/app.asar')
          magic,block,hs,n=struct.unpack_from('<4I',raw)
          assert magic==4 and block==hs+4
          tree=json.loads(raw[16:16+n])['files']
          for name in ['index.html','package.json','release-notes.js','browser-bridge.js',
                       'nano-flex-payment-108.js','nano-flex-core-108.js','nano-cash-plan-106.js',
                       'nano-payment-quality-105.js','nano-credit-picker-107.js','nano-payment-ledger-102.js']:
            e=tree[name];part=raw[8+block+int(e['offset']):8+block+int(e['offset'])+e['size']]
            assert part==Path('work/'+name).read_bytes(),name
            if 'integrity' in e:assert hashlib.sha256(part).hexdigest()==e['integrity']['hash'],name
          assert json.loads(Path('work/package.json').read_text())['version']=='1.0.109'
          print('PASS: official ASAR bytes and SHA-256 integrity, three-file-only patch')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nano-pos-109-verified-package
          path: |
            NANO-POS-Patch-1.0.108-to-1.0.109-PAYMENT-LABEL.zip
            work/index.html
            work/package.json
            work/release-notes.js
            work/browser-bridge.js
            work/nano-flex-payment-108.js
            work/nano-flex-core-108.js
            work/nano-cash-plan-106.js
            work/nano-payment-quality-105.js
            work/nano-credit-picker-107.js
            work/nano-payment-ledger-102.js
            work/test-payment-label-109.cjs
            work/test-flex-bridge-108.cjs
          if-no-files-found: error
  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nano-pos-109-verified-package
      - name: Check checkout label and accounting on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location work
          try {
            node --check browser-bridge.js
            node --check nano-flex-payment-108.js
            node test-payment-label-109.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Label check failed' }
            node test-flex-bridge-108.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Accounting regression failed' }
          } finally { Pop-Location }
  protected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure no changes to business data or activation
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD
          if git diff --name-only origin/main...HEAD | grep -E '^(nano-pos-update\.json|app\.asar|mobile/|database/|activation/|backup/)' ; then
            echo 'Protected data touched';exit 1
          fi
