name: Publish NANO POS v1.0.61 UI Payment Guard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nano-pos-1.0.61.yml'
      - 'build/v1.0.61/build.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nano-pos-v161-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build strictly from SHA-verified v1.0.60 production package
        run: |
          set -euo pipefail
          python3 -m py_compile build/v1.0.61/build.py
          python3 build/v1.0.61/build.py
      - name: Verify only approved UI files changed and billing records remain untouched
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,struct,json,pathlib,hashlib
          root=pathlib.Path('build/v1.0.61')
          meta=json.loads((root/'build-result.json').read_text())
          with zipfile.ZipFile(root/meta['fileName']) as z:
              assert z.testzip() is None
              raw=z.read('payload/app.asar')
          h=json.loads(raw[16:16+struct.unpack_from('<I',raw,12)[0]])
          offset=8+struct.unpack_from('<I',raw,4)[0]
          def file(path):
              n=h
              for x in path.split('/'): n=n['files'][x]
              return raw[offset+int(n['offset']):offset+int(n['offset'])+int(n['size'])]
          js=file('desktop-sync-ui.js')
          assert b'ensureGlobalStatusChip' not in js
          assert b"document.getElementById('nanoMobileSyncGlobalStatus')?.remove()" in js
          assert b'ensureHeaderDevicesBadge' in js and b'openConnectedDevices' in js
          assert b'data-download-mobile' in js and b'data-download-scanner' in js
          for p in ['index.html','mobile/www/index.html']:
              body=file(p)
              assert b'id="invPaid" value="0" min="0" step="0.01" inputmode="decimal"' in body
              assert b'id="connectedDevicesBadge"' in body
              assert b'v1.0.61 keyboard focus' in body
          assert hashlib.sha256(file('downloads/NANO-POS-Mobile-v1.3.7.apk')).hexdigest()==meta['mobileApkSha256']
          assert set(meta['changedFiles']).issubset({
              'desktop-sync-ui.js','index.html','mobile/www/index.html','package.json',
              'package-lock.json','app-config.js','release-notes.js'})
          assert meta['dataFilesModified'] is False
          assert json.loads(file('package.json'))['version']=='1.0.61'
          m=json.loads((root/'nano-pos-update-v161.json').read_text())
          assert m['version']=='1.0.61'
          assert m['patches'][0]['sha256']==meta['sha256']
          assert m['patches'][0]['appAsarSha256']==meta['appAsarSha256']
          print('PASS: UI badge removed, header preserved, payment input and preservation guards passed')
          PY
      - name: Publish optional patch v1.0.61, never overwrite old release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE='build/v1.0.61/NANO-POS-Patch-1.0.60-to-1.0.61-UI-PAYMENT-GUARDS.zip'
          if gh release view v1.0.61 >/dev/null 2>&1; then
            echo 'Release v1.0.61 already exists - will not overwrite'; exit 1
          fi
          gh release create v1.0.61 "$FILE" --target main \
            --title 'NANO POS v1.0.61 — Device Interface & Invoice Input' \
            --notes 'Optional focused desktop patch based on SHA-verified v1.0.60. Removes the redundant bottom-left floating Mobile Sync button, preserves the top device indicator and device center, adds nonnegative decimal input hints to the invoice paid field, and keyboard focus outlines. No backend changes: credit ledger, account balances, MEGA, synchronization, licensing and data storage remain unchanged. Back up and verify in your shop environment before rolling out.'
      - name: Re-download ZIP to verify published SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh release download v1.0.61 --pattern 'NANO-POS-Patch-1.0.60-to-1.0.61-UI-PAYMENT-GUARDS.zip' --dir verified
          WANT="$(python3 -c 'import json;print(json.load(open("build/v1.0.61/build-result.json"))["sha256"])')"
          GOT="$(sha256sum verified/NANO-POS-Patch-1.0.60-to-1.0.61-UI-PAYMENT-GUARDS.zip | cut -d' ' -f1)"
          test "$WANT" = "$GOT"
      - name: Update cloud updater manifest only after verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="$(gh api repos/bilalbaghdali/nano-pos-updates/contents/nano-pos-update.json --jq .sha)"
          CONTENT="$(base64 -w0 build/v1.0.61/nano-pos-update-v161.json)"
          gh api --method PUT repos/bilalbaghdali/nano-pos-updates/contents/nano-pos-update.json \
             -f message='Publish NANO POS Desktop v1.0.61 floating device button removal' \
             -f sha="$CURRENT" -f content="$CONTENT" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: nano-pos-v1.0.61-verified-metadata
          path: build/v1.0.61/build-result.json
          retention-days: 30
