name: Publish NANO POS v1.0.33

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.0.33.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download v1.0.32 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download v1.0.32 --repo "$GITHUB_REPOSITORY" --pattern "NANO-POS-Patch-1.0.31-to-1.0.32-PRO-PRINT-ENGINE-FIX.zip" --dir work
          cd work
          unzip -o NANO-POS-Patch-1.0.31-to-1.0.32-PRO-PRINT-ENGINE-FIX.zip
          test -f payload/app.asar
          echo "be83d542760750e67416ba0d7f7125fdd580a862aaa2dccca0ca849cff75cff8  payload/app.asar" | sha256sum -c -

      - name: Build v1.0.33
        run: |
          cp tools/.tmp-patch-v1.0.33.py work/patch.py
          cd work
          python patch.py
          echo "0d0022d87d8211f468aade66a3f7840f28a2982a90f030a13041ede521253819  payload/app.asar" | sha256sum -c -
          touch -t 202610071500 payload/app.asar
          zip -X -9 NANO-POS-Patch-1.0.32-to-1.0.33-FULL-INVOICE-LANGUAGE-PC-IP-FIX.zip payload/app.asar
          echo "5cd690cb97acc94235ed8ebb42be66edce925dbb3db66058e76cb69ec346f8cc  NANO-POS-Patch-1.0.32-to-1.0.33-FULL-INVOICE-LANGUAGE-PC-IP-FIX.zip" | sha256sum -c -

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd work
          if gh release view v1.0.33 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.33 NANO-POS-Patch-1.0.32-to-1.0.33-FULL-INVOICE-LANGUAGE-PC-IP-FIX.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.0.33 NANO-POS-Patch-1.0.32-to-1.0.33-FULL-INVOICE-LANGUAGE-PC-IP-FIX.zip               --repo "$GITHUB_REPOSITORY" --target main --title "NANO POS v1.0.33"               --notes "إصلاح شامل للغة الفاتورة وربط الكمبيوتر: تغيير لغة الطباعة يغيّر القالب والنصوص والتاريخ ووحدة المنتج وكل العناوين مع إبقاء اسم المنتج كما هو، وإصلاح حقل IP في ربط الكمبيوتر لمنع إعادة رسمه أثناء الكتابة."
          fi
