name: Inspect NANO POS mobile download buttons v1.0.58
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-mobile-buttons-v159.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact desktop sections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p src
          gh release download v1.0.58 --pattern 'NANO-POS-Patch-1.0.57-to-1.0.58-EMBEDDED-APK.zip' --dir src
          python3 - <<'PY'
          import zipfile,json,struct,re
          from pathlib import Path
          with zipfile.ZipFile(next(Path('src').glob('*.zip'))) as z:raw=z.read('payload/app.asar')
          size=struct.unpack_from('<I',raw,12)[0];h=json.loads(raw[16:16+size]);off=8+struct.unpack_from('<I',raw,4)[0]
          found={}
          def walk(node,prefix=''):
            for k,v in node['files'].items():
              p=prefix+k
              if 'files' in v:walk(v,p+'/')
              elif p.endswith(('.js','.html','.cjs','.json')) and ('node_modules/' not in p):
                b=raw[off+int(v['offset']):off+int(v['offset'])+int(v['size'])]
                found[p]=b.decode('utf8','replace')
          walk(h)
          terms=['mediafire','قارئ الباركود','تطبيق الباركود','wireless-scanner.apk','NANO-POS-Wireless-Scanner','تحميل تطبيق الهاتف','تنزيل تطبيق الهاتف','nanoOfflineApkCard','nanoOfflineSave','appDownloadSection','nano-mobile.apk']
          for term in terms:
            hits=[]
            for p,s in found.items():
              locs=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
              if locs:
                for loc in locs[:6]:
                  hits.append((p,loc,s[max(0,loc-800):min(len(s),loc+1300)]))
            print('========== TERM',repr(term),'MATCHES',len(hits))
            for p,loc,excerpt in hits[:15]:
              print('FILE',p,'OFFSET',loc)
              print('TEXT',excerpt.replace('\n','\\n'))
          PY