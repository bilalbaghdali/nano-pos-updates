name: Inspect NANO POS mobile download buttons v1.0.58
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-mobile-buttons-v159.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact desktop sections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p src
          gh release download v1.0.58 --pattern 'NANO-POS-Patch-1.0.57-to-1.0.58-EMBEDDED-APK.zip' --dir src
          python3 - <<'PY'
          import zipfile,json,struct,re
          from pathlib import Path
          with zipfile.ZipFile(next(Path('src').glob('*.zip'))) as z:raw=z.read('payload/app.asar')
          size=struct.unpack_from('<I',raw,12)[0];h=json.loads(raw[16:16+size]);off=8+struct.unpack_from('<I',raw,4)[0]
          found={}
          def walk(node,prefix=''):
            for k,v in node['files'].items():
              p=prefix+k
              if 'files' in v:walk(v,p+'/')
              elif p.endswith(('.js','.html','.cjs','.json')) and ('node_modules/' not in p):
                b=raw[off+int(v['offset']):off+int(v['offset'])+int(v['size'])]
                found[p]=b.decode('utf8','replace')
          walk(h)
          p='desktop-sync-ui.js'
          s=found[p]
          for token in ['MOBILE_APP_DOWNLOAD_URL','WIRELESS_SCANNER_DOWNLOAD_PATH','downloadAppDesc','scannerDownload','downloadApp','mobileDownload','desktopSync']:
            locs=[m.start() for m in re.finditer(re.escape(token),s,re.I)]
            print('TOKEN',token,'count',len(locs))
            for loc in locs[-8:]:
              print('OFFSET',loc,'SNIPPET',s[max(0,loc-1100):min(len(s),loc+1550)].replace('\n','\\n'))
          p='nano-mobile-offline-ui.js'
          s=found[p]
          print('OFFLINE-UI-JS',s[:12000])

          PY