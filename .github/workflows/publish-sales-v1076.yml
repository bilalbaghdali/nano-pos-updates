name: Publish NANO POS v1.0.76 — Responsive sales workspace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-sales-v1076.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nano-pos-sales-v1076
  cancel-in-progress: false

jobs:
  build-verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve and verify published NANO POS v1.0.75
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          gh release download v1.0.75 --repo "$GITHUB_REPOSITORY" \
            --pattern 'NANO-POS-Patch-1.0.74-to-1.0.75-FREE-PRODUCT-FIX.zip' --dir /tmp/release
          echo '957b4c1e8f2714689f49a7b88f185d3a1f67594feb4ffa8ac81cf9988268531b  /tmp/release/NANO-POS-Patch-1.0.74-to-1.0.75-FREE-PRODUCT-FIX.zip' | sha256sum -c
          unzip -q /tmp/release/NANO-POS-Patch-1.0.74-to-1.0.75-FREE-PRODUCT-FIX.zip 'payload/app.asar' -d /tmp/release/base
          echo '517f6256ef9b6fbfacf7f0ff2a92bc207867c9e4ea24532082a2f7f64f1856d2  /tmp/release/base/payload/app.asar' | sha256sum -c
      - name: Build redesigned sales UI and verify no accounting changes
        run: |
          set -euo pipefail
          npm install --prefix /tmp/asar-cli --no-audit --no-fund --no-save @electron/asar@3.4.1
          npm install --prefix /tmp/ui-test --no-audit --no-fund --no-save css-tree@3.1.0 jsdom@25.0.1
          ASAR=/tmp/asar-cli/node_modules/.bin/asar
          "$ASAR" extract /tmp/release/base/payload/app.asar /tmp/release/source
          cp /tmp/release/source/browser-bridge.js /tmp/release/bridge-original.js
          cp /tmp/release/source/renderer.js /tmp/release/renderer-original.js
          cp /tmp/release/source/nano-price-display.js /tmp/release/price-original.js
          node release/sales-v1.0.76/apply.js /tmp/release/source
          node --check /tmp/release/source/nano-sales-layout.js
          node --check /tmp/release/source/renderer.js
          node --check /tmp/release/source/browser-bridge.js
          cmp /tmp/release/bridge-original.js /tmp/release/source/browser-bridge.js
          cmp /tmp/release/renderer-original.js /tmp/release/source/renderer.js
          cmp /tmp/release/price-original.js /tmp/release/source/nano-price-display.js
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('node:assert/strict');
          const {JSDOM}=require('/tmp/ui-test/node_modules/jsdom');
          const csstree=require('/tmp/ui-test/node_modules/css-tree');
          const dir='/tmp/release/source/';
          const css=fs.readFileSync(dir+'nano-sales-layout.css','utf8');
          const ast=csstree.parse(css,{onParseError:e=>{throw e}});
          assert(ast.children.size>50,'Expected full screen stylesheet');
          for(const marker of ['#posProductGrid','#posCartContainer','#posSummaryBar','#posBarcodeScanInput',
            '#posCheckoutBtn','.nano-pos-stack','.nano-pos-tight','.nano-digital-total']) {
            assert(css.includes(marker),'Missing responsive section '+marker);
          }
          const html=fs.readFileSync(dir+'index.html','utf8');
          for(const id of ['salesSection','posProductsPane','posCartResizer','posCartContainer',
            'posSummaryBar','posProductGrid','posCheckoutBtn','cartTotal','posBarcodeScanInput','posProductSearchInput']){
            assert(html.includes('id="'+id+'"'),'Missing original element '+id);
          }
          assert(html.includes('href="nano-sales-layout.css"')&&html.includes('src="nano-sales-layout.js"'));
          const layout=fs.readFileSync(dir+'nano-sales-layout.js','utf8');
          const fake='<section id="salesSection" data-pos-layout="design2"><div id="posProductsPane"></div><div id="posCartResizer"></div><div id="posCartContainer"><div id="posSummaryBar"></div></div></section>';
          const dom=new JSDOM(fake,{runScripts:'outside-only',url:'https://example.test'});
          let width=1240, pending=[];
          const win=dom.window;
          Object.defineProperty(win.document.getElementById('salesSection'),'clientWidth',{get:()=>width});
          win.requestAnimationFrame=fn=>{pending.push(fn);return pending.length};
          win.ResizeObserver=class{observe(){}};
          function flush(){for(let i=0;pending.length&&i<10;i++){pending.shift()();}}
          win.eval(layout);flush();
          const section=win.document.getElementById('salesSection');
          const summary=win.document.getElementById('posSummaryBar');
          const products=win.document.getElementById('posProductsPane');
          const cart=win.document.getElementById('posCartContainer');
          assert(section.classList.contains('nano-pos-workspace'));
          assert(!section.classList.contains('nano-pos-stack'));
          assert.equal(summary.parentElement,products,'Design 2 wide summary stays in products pane');
          width=800;win.dispatchEvent(new win.Event('resize'));flush();
          assert(section.classList.contains('nano-pos-stack'),'Narrow viewport must stack panels');
          assert.equal(summary.parentElement,cart,'Narrow layout must show checkout below cart');
          width=610;win.dispatchEvent(new win.Event('resize'));flush();
          assert(section.classList.contains('nano-pos-tight'),'Tight layout must use compact controls');
          width=1280;win.dispatchEvent(new win.Event('resize'));flush();
          assert(!section.classList.contains('nano-pos-stack'));
          assert.equal(summary.parentElement,products,'Original design2 restored after resizing');
          section.setAttribute('data-pos-layout','design1');
          win.dispatchEvent(new win.Event('resize'));flush();
          assert.equal(summary.parentElement,cart,'Design 1 summary belongs to cart');
          console.log('PASS: balanced sales layout, stack/unstack, summary location, selectors and unchanged sales code');
          JS
          mkdir -p /tmp/release/payload
          "$ASAR" pack /tmp/release/source /tmp/release/payload/app.asar
          node - <<'JS'
          const asar=require('/tmp/asar-cli/node_modules/@electron/asar');
          const fs=require('fs');
          const p='/tmp/release/payload/app.asar';
          const pkg=JSON.parse(asar.extractFile(p,'package.json').toString('utf8'));
          if(pkg.version!=='1.0.76')throw Error('Bad package version');
          for(const file of ['nano-sales-layout.css','nano-sales-layout.js']){
            if(!asar.extractFile(p,file).length)throw Error('Missing package file '+file);
          }
          const html=asar.extractFile(p,'index.html').toString('utf8');
          if(!html.includes('nano-sales-layout.css')||!html.includes('nano-sales-layout.js'))throw Error('New assets not wired into installer');
          if(!asar.extractFile(p,'browser-bridge.js').equals(fs.readFileSync('/tmp/release/bridge-original.js')))throw Error('Payment logic changed');
          if(!asar.extractFile(p,'renderer.js').equals(fs.readFileSync('/tmp/release/renderer-original.js')))throw Error('Sales logic changed');
          JS
          (cd /tmp/release && zip -q -6 'NANO-POS-Patch-1.0.75-to-1.0.76-SALES-WORKSPACE.zip' payload/app.asar)
          unzip -t /tmp/release/NANO-POS-Patch-1.0.75-to-1.0.76-SALES-WORKSPACE.zip
          sha256sum /tmp/release/payload/app.asar /tmp/release/NANO-POS-Patch-1.0.75-to-1.0.76-SALES-WORKSPACE.zip
      - name: Publish NANO POS v1.0.76 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.0.76 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p /tmp/release/check
            gh release download v1.0.76 --repo "$GITHUB_REPOSITORY" \
              --pattern 'NANO-POS-Patch-1.0.75-to-1.0.76-SALES-WORKSPACE.zip' --dir /tmp/release/check
            cmp /tmp/release/NANO-POS-Patch-1.0.75-to-1.0.76-SALES-WORKSPACE.zip \
              /tmp/release/check/NANO-POS-Patch-1.0.75-to-1.0.76-SALES-WORKSPACE.zip
          else
            gh release create v1.0.76 /tmp/release/NANO-POS-Patch-1.0.75-to-1.0.76-SALES-WORKSPACE.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title 'NANO POS v1.0.76 — إعادة تنظيم شاشة البيع' \
              --notes 'إعادة توزيع المنتجات والسلة والإجمالي الرقمي والبحث بالباركود وأزرار الدفع، مع تخطيطات متجاوبة لجميع أبعاد النافذة والحفاظ على حسابات البيع.'
          fi
          gh release view v1.0.76 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -Fx 'NANO-POS-Patch-1.0.75-to-1.0.76-SALES-WORKSPACE.zip'
      - name: Enable verified automatic update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 release/sales-v1.0.76/update_manifest.py
