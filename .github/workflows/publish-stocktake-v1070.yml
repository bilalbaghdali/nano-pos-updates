name: Publish NANO POS desktop stocktake v1.0.70

on:
  push:
    paths:
      - .github/workflows/publish-stocktake-v1070.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nano-pos-stocktake-v1.0.70-publish
  cancel-in-progress: false

jobs:
  build-verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve and validate published v1.0.69 baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          gh release download v1.0.69 --repo "$GITHUB_REPOSITORY" \
            --pattern 'NANO-POS-Patch-1.0.68-to-1.0.69-MULTIPHONE-COUNT.zip' --dir /tmp/release
          echo '95434b1e137774c53fabc79f5daca47d86e56c5aef732945404f9ba08121e81a  /tmp/release/NANO-POS-Patch-1.0.68-to-1.0.69-MULTIPHONE-COUNT.zip' | sha256sum -c
          unzip -q /tmp/release/NANO-POS-Patch-1.0.68-to-1.0.69-MULTIPHONE-COUNT.zip 'payload/app.asar' -d /tmp/release/base
          echo 'c526615eb0277ce825e62709fba1a2baf94764311aec73a5d1782dd5ccf9618a  /tmp/release/base/payload/app.asar' | sha256sum -c
      - name: Rebuild with desktop-only stocktake changes
        run: |
          set -euo pipefail
          npm install --prefix /tmp/asar-cli --no-audit --no-fund --no-save @electron/asar@3.4.1
          ASAR=/tmp/asar-cli/node_modules/.bin/asar
          "$ASAR" extract /tmp/release/base/payload/app.asar /tmp/release/source
          patch --batch --fuzz=0 -d /tmp/release/source -p1 -i "$GITHUB_WORKSPACE/release/stocktake-v1.0.70/desktop.patch"
          node - <<'JS'
          const fs = require('fs');
          const path = '/tmp/release/source/mobile/www/index.html';
          let html = fs.readFileSync(path, 'utf8');
          const disabled = ['nano-stocktake-approval.js','nano-multi-count.js','nano-stocktake-drafts-ui.js','nano-multi-count-ui.js'];
          for (const file of disabled) if (!html.includes('src="'+file+'"')) throw new Error('Missing legacy mobile script '+file);
          html = html.replace(/<script\b[^>]*\bsrc="([^"]+)"[^>]*><\/script>/g, (tag,src) => disabled.includes(src) ? '' : tag);
          for (const file of disabled) if (html.includes('src="'+file+'"')) throw new Error('Legacy script still active '+file);
          fs.writeFileSync(path,html);
          JS
          cp release/stocktake-v1.0.70/desktop-tools.js /tmp/release/source/stocktake/desktop-tools.js
          node - <<'JS'
          const fs = require('fs');
          const base = '/tmp/release/source/';
          const pkg = JSON.parse(fs.readFileSync(base+'package.json','utf8'));
          if (pkg.version !== '1.0.69') throw new Error('Incorrect baseline version: '+pkg.version);
          pkg.version = '1.0.70';
          fs.writeFileSync(base+'package.json', JSON.stringify(pkg,null,2)+'\n');
          const lockPath=base+'package-lock.json';
          if (fs.existsSync(lockPath)) {
            const lock=JSON.parse(fs.readFileSync(lockPath,'utf8'));
            lock.version='1.0.70';
            if (lock.packages && lock.packages['']) lock.packages[''].version='1.0.70';
            fs.writeFileSync(lockPath,JSON.stringify(lock,null,2)+'\n');
          }
          JS
          node --check /tmp/release/source/browser-bridge.js
          node --check /tmp/release/source/mobile-sync-server.cjs
          node --check /tmp/release/source/stocktake/desktop-tools.js
          mkdir -p /tmp/release/payload
          "$ASAR" pack /tmp/release/source /tmp/release/payload/app.asar
          node - <<'JS'
          const asar = require('/tmp/asar-cli/node_modules/@electron/asar');
          const fs = require('fs');
          const root = '/tmp/release/source/';
          const pkg = JSON.parse(asar.extractFile('/tmp/release/payload/app.asar', 'package.json').toString('utf8'));
          if (pkg.version !== '1.0.70') throw new Error('ASAR version mismatch: '+pkg.version);
          for (const filename of ['index.html', 'mobile/www/index.html']) {
            const html = fs.readFileSync(root+filename,'utf8');
            for (const legacy of ['src="nano-multi-count.js"', 'src="nano-multi-count-ui.js"', 'src="nano-stocktake-approval.js"', 'src="nano-stocktake-drafts-ui.js"']) {
              if (html.includes(legacy)) throw new Error('Old stocktake scripts remain active in '+filename);
            }
          }
          if (!fs.existsSync(root+'stocktake/desktop-tools.js')) throw new Error('Missing desktop-only stocktake tools');
          JS
          (cd /tmp/release && zip -q -6 'NANO-POS-Patch-1.0.69-to-1.0.70-DESKTOP-STOCKTAKE.zip' payload/app.asar)
          unzip -t /tmp/release/NANO-POS-Patch-1.0.69-to-1.0.70-DESKTOP-STOCKTAKE.zip
          sha256sum /tmp/release/payload/app.asar /tmp/release/NANO-POS-Patch-1.0.69-to-1.0.70-DESKTOP-STOCKTAKE.zip
      - name: Publish GitHub Release v1.0.70
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.0.70 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release exists, verifying asset checksum'
            mkdir -p /tmp/release/check
            gh release download v1.0.70 --repo "$GITHUB_REPOSITORY" \
              --pattern 'NANO-POS-Patch-1.0.69-to-1.0.70-DESKTOP-STOCKTAKE.zip' --dir /tmp/release/check
            cmp /tmp/release/NANO-POS-Patch-1.0.69-to-1.0.70-DESKTOP-STOCKTAKE.zip \
              /tmp/release/check/NANO-POS-Patch-1.0.69-to-1.0.70-DESKTOP-STOCKTAKE.zip
          else
            gh release create v1.0.70 /tmp/release/NANO-POS-Patch-1.0.69-to-1.0.70-DESKTOP-STOCKTAKE.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title 'NANO POS v1.0.70 — تحسينات عامة' \
              --notes 'تحسينات عامة: إزالة الجرد الجماعي وجرد الهاتف، قصر الجرد على الكمبيوتر، وتصدير CSV وطباعة تقرير الجرد.'
          fi
          gh release view v1.0.70 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -Fx 'NANO-POS-Patch-1.0.69-to-1.0.70-DESKTOP-STOCKTAKE.zip'
      - name: Enable verified automatic update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 release/stocktake-v1.0.70/update_manifest.py