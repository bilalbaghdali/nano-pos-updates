name: Publish verified NANO POS 1.0.51 login effect fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nano-pos-1.0.51.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run animation behavior regression tests
        run: node build/v1.0.51/test_effect.cjs
      - name: Reconstruct verified app.asar from v1.0.50
        run: python3 build/v1.0.51/build.py
      - name: Publish optional patch without overwriting existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="NANO-POS-Patch-1.0.50-to-1.0.51-LOGIN-EFFECT-FIX.zip"
          if gh release view v1.0.51 >/dev/null 2>&1; then
            echo "v1.0.51 already exists; refuse unreviewed replacement"
            exit 1
          fi
          gh release create v1.0.51 "$ASSET" --target main --title "NANO POS v1.0.51 — System Stability Improvements" --notes "Optional fix: moves video-inspired login confirmation resources before the renderer, waits for the visual transition to finish after successful username/password authentication and before opening Home. Incorrect credentials do not trigger the effect. No data or other business workflow changes. Build and behavior tests passed; real Windows display still requires verification."
      - name: Download release and verify file checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          gh release download v1.0.51 --pattern 'NANO-POS-Patch-1.0.50-to-1.0.51-LOGIN-EFFECT-FIX.zip' --dir verified
          EXPECTED="$(python3 -c 'import json; print(json.load(open("build-result.json"))["sha256"])')"
          ACTUAL="$(sha256sum verified/NANO-POS-Patch-1.0.50-to-1.0.51-LOGIN-EFFECT-FIX.zip | cut -d' ' -f1)"
          test "$EXPECTED" = "$ACTUAL"
      - name: Archive checksum metadata
        uses: actions/upload-artifact@v4
        with:
          name: nano-pos-v1.0.51-patch-metadata
          path: build-result.json
