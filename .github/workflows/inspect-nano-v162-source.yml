name: Inspect NANO POS v1.0.61 phase one APIs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-nano-v162-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact released app files and DOM contracts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p retrieved
          gh release download v1.0.61 --pattern 'NANO-POS-Patch-1.0.60-to-1.0.61-UI-PAYMENT-GUARDS.zip' --dir retrieved
          python3 - <<'PY'
          import pathlib,hashlib,json,zipfile,struct,re
          m=json.loads(pathlib.Path('nano-pos-update.json').read_text())
          assert m['version']=='1.0.61'
          p=m['patches'][0]
          with zipfile.ZipFile(pathlib.Path('retrieved')/p['fileName']) as z: raw=z.read('payload/app.asar')
          assert hashlib.sha256(raw).hexdigest()==p['appAsarSha256']
          h=json.loads(raw[16:16+struct.unpack_from('<I',raw,12)[0]])
          off=8+struct.unpack_from('<I',raw,4)[0]
          files={}
          def walk(d,pre=''):
            for n,x in d['files'].items():
              name=pre+n
              if 'files' in x:walk(x,name+'/')
              elif name.endswith(('.js','.html','.css')) and x['size']<4000000:
                files[name]=raw[off+int(x['offset']):off+int(x['offset'])+x['size']].decode('utf-8','replace')
          walk(h)
          print('MODULES',' '.join(sorted(k for k in files if k.startswith(('nano-','desktop-','pc-','mobile-','mega-')) and '/' not in k)))
          for f in ['index.html','mobile/www/index.html']:
            s=files[f]
            for term in ['id="posSearchInput"','id="posProductSearchInput"','id="posBarcodeInput"','id="posProducts"','id="nanoHomeSection"','id="posToolbar"','id="salesSection"','id="inventorySection"','id="notificationsBtn"','id="posSearch"']:
              at=s.find(term)
              print('DOM',f,term,'AT',at,'CONTEXT',repr(s[max(0,at-280):at+500]) if at>=0 else '')
            for mo in list(re.finditer(r'<script[^>]+src="([^"]+)"',s))[-70:]:
              print('SCRIPT',f,mo.group(1))
          for f in ['nano-v134-core.js','nano-debt-stats-fix.js','nano-commerce-ui.js','nano-v146-section-search.js','desktop-sync-ui.js','nano-mobile-credit.js']:
            s=files.get(f)
            if not s:continue
            print('MODULE',f,'LENGTH',len(s))
            for term in ['getProducts','getInventory','getStock','stock_quantity','min_stock','expiry_date','barcode','posSearchInput','notification','search','currentSection']:
              for mo in list(re.finditer(re.escape(term),s,re.I))[:2]:
                print('CODE',f,term,mo.start(),repr(s[max(0,mo.start()-150):mo.start()+400]))
          for f in ['index.html','mobile/www/index.html']:
            s=files[f]
            for term in ['id="productMinStock"','id="productStock"','id="productExpiry"','id="productExpire"','id="posProductSearchInput"','id="posQuickSearch"','id="posBarcode"','id="lowStock','id="productBarcode"']:
              at=s.find(term)
              if at>=0: print('PRODUCT_FORM',f,term,repr(s[max(0,at-300):at+700]))
          for f in ['navigation-performance.js','wireless-barcode-desktop.js','nano-v136-shortcuts.js','nano-debt-stats-fix.js']:
            s=files.get(f,'')
            print('BASIC_MODULE',f,'LENGTH',len(s),'START',repr(s[:900]))
          for path,s in files.items():
            if path.startswith('node_modules/'): continue
            for term in ['expiry_date','expiration_date','expirationDate','product_expiry','expires_at','lowStockThreshold']:
              for mo in list(re.finditer(re.escape(term),s,re.I))[:1]:
                if path.endswith(('html','.js')):print('EXPIRY',path,term,repr(s[max(0,mo.start()-100):mo.start()+240]))
          s=files.get('renderer.js','')
          for term in ['getProducts','getAllProducts','loadProducts','posSearchInput','posProductSearch','renderPosProducts','filterPosProducts','stock_quantity','min_stock','barcode','api.getProducts','getInventory']:
            mo=re.search(re.escape(term),s,re.I)
            if mo:print('RENDERER',term,mo.start(),repr(s[max(0,mo.start()-130):mo.start()+320]))
          PY
