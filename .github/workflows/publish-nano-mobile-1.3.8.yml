name: Publish NANO POS Mobile v1.3.8 APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-nano-mobile-1.3.8.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve authentic successful Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh run download 38746337260 --repo bilalbaghdali/nano-pos-mobile --name NANO-POS-Mobile-APK --dir out
          test -s out/NANO-POS-Mobile-v1.3.8.apk
          unzip -t out/NANO-POS-Mobile-v1.3.8.apk | tail -3
          sha256sum out/NANO-POS-Mobile-v1.3.8.apk
      - name: Publish signed-build-compatible debug APK in mobile prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view mobile-v1.3.8 >/dev/null 2>&1; then
            echo 'Already published, refusing replacement'; exit 1
          fi
          gh release create mobile-v1.3.8 out/NANO-POS-Mobile-v1.3.8.apk --target main --prerelease             --title 'NANO POS Mobile v1.3.8'             --notes 'Debug Android APK for the unchanged com.nanopos.mobile application ID. Shows the desktop-served mobile pages and supports barcode events for the new stocktake draft flow when connected to NANO POS desktop v1.0.67+. Reinstall behavior and permissions should be tested before shop rollout. No licensing or user data modification.'
      - name: Verify download and update mobile manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download mobile-v1.3.8 --pattern NANO-POS-Mobile-v1.3.8.apk --dir published
          cmp out/NANO-POS-Mobile-v1.3.8.apk published/NANO-POS-Mobile-v1.3.8.apk
          python3 - <<'PY'
          import hashlib,json,pathlib,datetime
          p=pathlib.Path('published/NANO-POS-Mobile-v1.3.8.apk')
          data={'schema':1,'product':'NANO POS Mobile','channel':'stable','published':True,'version':'1.3.8',
             'downloadUrl':'https://github.com/bilalbaghdali/nano-pos-updates/releases/download/mobile-v1.3.8/NANO-POS-Mobile-v1.3.8.apk',
             'pageUrl':'https://github.com/bilalbaghdali/nano-pos-updates/releases/tag/mobile-v1.3.8',
             'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
             'publishedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('mobile-latest-v138.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          PY
          SHA="$(gh api repos/bilalbaghdali/nano-pos-updates/contents/mobile-latest.json --jq .sha 2>/dev/null || true)"
          CONTENT="$(base64 -w0 mobile-latest-v138.json)"
          if [ -n "$SHA" ]; then
            gh api -X PUT repos/bilalbaghdali/nano-pos-updates/contents/mobile-latest.json               -f message='Publish NANO POS mobile v1.3.8' -f sha="$SHA" -f content="$CONTENT" >/dev/null
          else
            gh api -X PUT repos/bilalbaghdali/nano-pos-updates/contents/mobile-latest.json               -f message='Publish NANO POS mobile v1.3.8' -f content="$CONTENT" >/dev/null
          fi
