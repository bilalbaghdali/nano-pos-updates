name: Inspect v1.0.68 multi-phone stocktake RPC
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-nano-v169-count.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current authoritative app entrypoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p z
          gh release download v1.0.68 --pattern 'NANO-POS-Patch-1.0.67-to-1.0.68-PRICING-OFFERS.zip' --dir z
          python3 - <<'PY'
          import json,struct,hashlib,zipfile,pathlib,re
          man=json.loads(pathlib.Path('nano-pos-update.json').read_text());assert man['version']=='1.0.68'
          p=man['patches'][0]
          with zipfile.ZipFile(pathlib.Path('z')/p['fileName']) as z:raw=z.read('payload/app.asar')
          assert hashlib.sha256(raw).hexdigest()==p['appAsarSha256']
          h=json.loads(raw[16:16+struct.unpack_from('<I',raw,12)[0]]);start=8+struct.unpack_from('<I',raw,4)[0]
          def f(path):
            n=h
            for bit in path.split('/'):n=n['files'][bit]
            return raw[start+int(n['offset']):start+int(n['offset'])+int(n['size'])].decode('utf8','replace')
          for path in ['browser-bridge.js','mobile/www/browser-bridge.js','mobile-sync-server.cjs','pc-sync-service.cjs','electron-main.cjs','mobile/www/mobile-sync-client.js','mobile/www/nano-stocktake-drafts-ui.js','nano-stocktake-drafts-ui.js']:
            try:s=f(path)
            except KeyError:continue
            print('MODULE',path,len(s))
            needles=(['function permissionForChannel','function permissionAllowed','get-stocktake','create-stocktake-draft','approve-stocktake-draft','rpcContext','dispatchRpc','nano-sync/call','deviceForRequest','webCallAllowed','operationGuard.call','process-sale','const api = async',
              'const initial','function save(', 'const save =', 'function normalize(', 'function clone(','window.__browserElectron','window.api','get-user','get-current-user','get-connected-clients']
              if 'browser-bridge' in path or 'sync-' in path or 'electron-main' in path else
              ['get-stocktake-sheet','get-stocktake-drafts','getStocktakeSheet','getStocktakeDrafts','nano-native-barcode','nano-native-scanner-state','window.api','__browserElectron'])
            for needle in needles:
              pos=s.find(needle)
              if pos>=0:print('HIT',path,needle,pos,repr(s[max(0,pos-260):pos+1750]))
          for path in ['electron-main.cjs','mobile-sync-server.cjs']:
            s=f(path)
            for marker in ['async function dispatchMobileRpc(', 'function dispatchMobileRpc(', 'const dispatchMobileRpc', 'function callRenderer', 'rpcContext', 'mobile-sync', 'queueCommand(']:
              pos=s.find(marker)
              if pos>=0:print('DETAIL',path,marker,pos,repr(s[max(0,pos-350):pos+2000]))
          hjson=json.loads(raw[16:16+struct.unpack_from('<I',raw,12)[0]])
          print('MOBILE_DIR',list(hjson['files']['mobile']['files']['www']['files'].keys()))
          for p in ['mobile/www/index.html','mobile/www/browser-bridge.js']:
            body=f(p)
            for key in ['nano-sync/call','nano-mobile-sync','nano-mobile','__browserElectron','nanoToken','nanoDevice','mobile-sync','remoteCall','rpcBridge','ipcRenderer.invoke','window.api','nano-remote']:
              print('MOBSCAN',p,key,body.count(key))
          bridge=f('mobile/www/mobile-sync-bridge.js')
          for key in ['nano-sync/call','ipcRenderer.invoke','__browserElectron','window.api','getStocktakeSheet','window.nanoMobileSync','invoke','nanoToken','nanoDevice']:
            pos=bridge.find(key)
            print('RELAY',key,pos,repr(bridge[max(0,pos-250):pos+1050] if pos>=0 else ''))
          print('RELAY_HEAD',repr(bridge[:1800]))
          bridge=f('mobile/www/mobile-sync-bridge.js')
          for key in ['window.__browserElectron.ipcRenderer.invoke =','ipcRenderer.invoke =','async function invoke','const invoke =','queueOffline','optimisticQueuedResult','isWriteChannel','WRITE_CHANNELS','sendRemoteCall(', 'if (isNetworkError', 'offline', 'localInvoke(']:
            pos=bridge.find(key)
            if pos>=0:print('BRIDGEDETAIL',key,pos,repr(bridge[max(0,pos-350):pos+1700]))
          for key in ['async function remoteInvoke', 'function remoteInvoke', 'function isWriteChannel', 'if (isWriteChannel', 'isWriteChannel(channel)', 'return enqueueOperation(', 'const config = getConfig();']:
            i=bridge.find(key)
            if i>=0:print('RELAY_TAIL',key,i,repr(bridge[max(0,i-80):i+2550]))
          print('END')
          PY
