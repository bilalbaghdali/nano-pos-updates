name: Publish NANO POS patch
on:
  push:
    branches: [main]
    paths: ['incoming/*.zip']
  workflow_dispatch:
    inputs:
      archive:
        description: 'Path to existing incoming/*.zip patch'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: nano-pos-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select ZIP
        id: select
        shell: bash
        env:
          MANUAL_ARCHIVE: ${{ inputs.archive }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            file="$MANUAL_ARCHIVE"
          else
            mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'incoming/*.zip')
            [[ ${#files[@]} -eq 1 ]] || { echo "Push exactly one ZIP"; exit 1; }
            file="${files[0]}"
          fi
          [[ -f "$file" ]] || exit 1
          echo "archive=$file" >> "$GITHUB_OUTPUT"
      - name: Verify ZIP and prepare manifest
        id: prep
        env:
          ARCHIVE: ${{ steps.select.outputs.archive }}
        run: python3 .github/scripts/prepare-release.py "$ARCHIVE"
      - name: Publish release and attach ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prep.outputs.tag }}
          ASSET: ${{ steps.prep.outputs.asset }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag already published"; exit 1
          fi
          gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "NANO POS $TAG" --notes "Automatic NANO POS patch."
      - name: Update live manifest after successful release
        env:
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nano-pos-update.json
          git commit -m "Publish NANO POS $VERSION"
          git push
