name: Publish NANO POS v1.0.31\n# retry with verified release-notes payload

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.0.31.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download v1.0.30 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download v1.0.30 --repo "$GITHUB_REPOSITORY" --pattern "NANO-POS-Patch-1.0.29-to-1.0.30-PRO-PRINT-LANGUAGE.zip" --dir work
          cd work
          unzip -o NANO-POS-Patch-1.0.29-to-1.0.30-PRO-PRINT-LANGUAGE.zip
          test -f payload/app.asar
          echo "063758a883bb5b69ce09f042c234f818b4a784166f545f16778d9c6dd894506c  payload/app.asar" | sha256sum -c -

      - name: Build v1.0.31
        run: |
          cp tools/.tmp-patch-v1.0.31.py work/patch.py
          cd work
          python patch.py
          echo "cc406ee8429e16a472096b4d90d62cd19b316d0c05c620ce6a8c49883288ef31  payload/app.asar" | sha256sum -c -
          touch -t 202610071405 payload/app.asar
          zip -X -9 NANO-POS-Patch-1.0.30-to-1.0.31-RELEASE-NOTES-FIX.zip payload/app.asar
          sha256sum NANO-POS-Patch-1.0.30-to-1.0.31-RELEASE-NOTES-FIX.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd work
          if gh release view v1.0.31 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.31 NANO-POS-Patch-1.0.30-to-1.0.31-RELEASE-NOTES-FIX.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.0.31 NANO-POS-Patch-1.0.30-to-1.0.31-RELEASE-NOTES-FIX.zip               --repo "$GITHUB_REPOSITORY" --target main --title "NANO POS v1.0.31"               --notes "إصلاح مميزات الإصدار الحالي: أصبحت مرتبطة برقم النسخة المثبتة، وتتم مزامنتها مع سجل الإصدارات على GitHub بدل قائمة ثابتة."
          fi
