name: NANO POS 1.0.107 - Credit Customer Checkout Tests
on:
  push:
    branches: [feature/credit-customer-checkout-107]
    paths:
      - '.github/assets/nano-credit-picker-107.js'
      - '.github/scripts/build-credit-picker-107.py'
      - '.github/scripts/test-credit-ui-107.cjs'
      - '.github/scripts/test-credit-bridge-107.cjs'
      - '.github/workflows/test-credit-checkout-107.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify official 1.0.106 app and archive integrity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source work
          gh release download v1.0.106 --pattern NANO-POS-Patch-1.0.105-to-1.0.106-CASH-FASTSTART.zip --dir source
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          m=json.loads(Path('nano-pos-update.json').read_text(encoding='utf8'))
          assert m['version']=='1.0.106' and m['published']
          path=Path('source/NANO-POS-Patch-1.0.105-to-1.0.106-CASH-FASTSTART.zip')
          assert hashlib.sha256(path.read_bytes()).hexdigest()==m['patches'][0]['sha256']
          with zipfile.ZipFile(path) as z:
            assert z.namelist()==['payload/app.asar']
            assert hashlib.sha256(z.read('payload/app.asar')).hexdigest()==m['patches'][0]['appAsarSha256']
          PY
      - name: Verify picker, customer credit, stock and previous payment logic
        run: |
          set -euo pipefail
          python3 .github/scripts/build-credit-picker-107.py \
            source/NANO-POS-Patch-1.0.105-to-1.0.106-CASH-FASTSTART.zip \
            NANO-POS-Patch-1.0.106-to-1.0.107-CREDIT-CUSTOMER.zip work
          for n in nano-credit-picker-107.js browser-bridge.js release-notes.js; do node --check "work/$n"; done
          cp .github/scripts/test-credit-ui-107.cjs work/
          cp .github/scripts/test-credit-bridge-107.cjs work/
          (cd work && node test-credit-bridge-107.cjs)
          (cd work && npm install --ignore-scripts --no-save jsdom@26.1.0 && node test-credit-ui-107.cjs)
          python3 - <<'PY'
          from pathlib import Path
          import json,struct,hashlib,zipfile
          with zipfile.ZipFile('NANO-POS-Patch-1.0.106-to-1.0.107-CREDIT-CUSTOMER.zip') as z:
            assert z.namelist()==['payload/app.asar'];raw=z.read('payload/app.asar')
          magic,b,hs,n=struct.unpack_from('<4I',raw)
          assert magic==4 and b==hs+4
          files=json.loads(raw[16:16+n])['files']
          for name in ['index.html','package.json','release-notes.js','nano-credit-picker-107.js',
            'browser-bridge.js','nano-payment-quality-105.js','nano-cash-guide-106.js',
            'nano-cash-plan-106.js','nano-payment-ledger-102.js','nano-checkout-choice-104.js']:
            e=files[name];blob=raw[8+b+int(e['offset']):8+b+int(e['offset'])+e['size']]
            assert blob==Path('work/'+name).read_bytes(),name
            if 'integrity' in e:assert hashlib.sha256(blob).hexdigest()==e['integrity']['hash'],name
          assert json.loads(Path('work/package.json').read_text())['version']=='1.0.107'
          print('PASS official ASAR structure and hash, unchanged DB/license/payment sources')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nano-pos-107-credit-checkout-candidate
          path: |
            NANO-POS-Patch-1.0.106-to-1.0.107-CREDIT-CUSTOMER.zip
            work/index.html
            work/package.json
            work/release-notes.js
            work/nano-credit-picker-107.js
            work/browser-bridge.js
            work/nano-payment-quality-105.js
            work/nano-cash-guide-106.js
            work/nano-cash-plan-106.js
            work/nano-payment-ledger-102.js
            work/nano-checkout-choice-104.js
            work/test-credit-ui-107.cjs
            work/test-credit-bridge-107.cjs
          if-no-files-found: error
  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nano-pos-107-credit-checkout-candidate
      - name: Test credit customer modal and stored debts on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location work
          try{
            node --check nano-credit-picker-107.js
            node --check browser-bridge.js
            node test-credit-bridge-107.cjs
            if($LASTEXITCODE -ne 0){throw 'Credit accounting integration failed'}
            npm install --ignore-scripts --no-save jsdom@26.1.0
            if($LASTEXITCODE -ne 0){throw 'UI dependency install failed'}
            node test-credit-ui-107.cjs
            if($LASTEXITCODE -ne 0){throw 'Credit customer modal failed'}
          }finally{Pop-Location}
  protected:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard original business data and updater manifest
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD
          if git diff --name-only origin/main...HEAD | grep -E '^(nano-pos-update\.json|app\.asar|mobile/|database/|activation/|backup/)' ; then
            echo 'Protected business path modified';exit 1
          fi
