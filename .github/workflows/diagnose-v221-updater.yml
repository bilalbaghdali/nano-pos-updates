name: Temporary diagnose NANO POS v2.0.21 update discovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-v221-updater.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download verified current package and inspect update logic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          gh release download v2.0.21 -R bilalbaghdali/nano-pos-updates --pattern NANO-POS-Patch-2.0.20-to-2.0.21-MANUFACTURING-CENTER.zip --dir .
          if($LASTEXITCODE -ne 0){throw 'Could not download current package'}
          @'
          import hashlib,json,struct,zipfile,re,sys
          sys.stdout.reconfigure(encoding='utf-8', errors='replace')
          p='NANO-POS-Patch-2.0.20-to-2.0.21-MANUFACTURING-CENTER.zip'
          with zipfile.ZipFile(p) as z:
              raw=z.read('payload/app.asar')
          magic,block,hs,js=struct.unpack_from('<4I',raw)
          tree=json.loads(raw[16:16+js].decode('utf-8'))
          start=8+block
          files={}
          def walk(node,prefix=''):
              for name,e in node.get('files',{}).items():
                  path=prefix+name
                  if 'files' in e: walk(e,path+'/')
                  elif 'offset' in e and 'size' in e:
                      a=start+int(e['offset']); files[path]=raw[a:a+int(e['size'])]
          walk(tree)
          print('PACKAGE FILE COUNT',len(files))
          print('PACKAGE VERSION',json.loads(files['package.json']))
          print('UPDATER PATHS',[k for k in files if re.search(r'update|electron-main|preload',k,re.I)])
          needles=['nano-pos-update.json','nano-update-check','nano-update-download','getCurrentAppVersion','fromVersions','raw.githubusercontent.com','github.com/bilalbaghdali/nano-pos-updates','update-config.json','manifest.version','releaseHistory','versionCompare','semver','isUpdateAvailable','available =','published','MANIFEST','manifestUrl','parseVersion','compareVersions','currentVersion','gitHub']
          for path in [k for k in files if re.search(r'electron-main|electron-native-preload|update-manager|update-client|main\.cjs|preload',k,re.I)]:
              text=files[path].decode('utf-8','ignore')
              print('\\n===== FILE',path,'len',len(text),'sha256',hashlib.sha256(files[path]).hexdigest(),'=====')
              for needle in needles:
                  inds=[]; pos=0
                  while True:
                      i=text.lower().find(needle.lower(),pos)
                      if i<0: break
                      inds.append(i);pos=i+len(needle)
                      if len(inds)>=3: break
                  for i in inds:
                      print('\\n--- MATCH',repr(needle),'at',i,'---')
                      print(text[max(0,i-650):min(len(text),i+1400)].replace('\\r',''))
          '@ | Set-Content -Encoding utf8 inspect-updater.py
          python inspect-updater.py
          if($LASTEXITCODE -ne 0){throw 'Updater inspection failed'}
