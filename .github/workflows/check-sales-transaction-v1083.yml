name: Inspect sale transaction and analytics fields
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-sales-transaction-v1083.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show sale handling excerpt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/app
          gh release download v1.0.82 --repo "$GITHUB_REPOSITORY" --pattern 'NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip' --dir /tmp/app
          unzip -q /tmp/app/NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip payload/app.asar -d /tmp/app
          npm install --prefix /tmp/asar --no-fund --no-audit --no-save @electron/asar@3.4.1 >/dev/null
          /tmp/asar/node_modules/.bin/asar extract /tmp/app/payload/app.asar /tmp/app/src
          node - <<'JS'
          const fs=require('fs');
          const b=fs.readFileSync('/tmp/app/src/browser-bridge.js','utf8');
          const r=fs.readFileSync('/tmp/app/src/renderer.js','utf8');
          for (const [label,text,phrase,size] of [['DB_PROCESS',b,"if (channel === 'process-sale')",10500],['DB_INIT',b,'function normalize(',1400],['DB_SALES_EDIT',b,'editSaleId',1700],['DB_PRODUCTS',b,"if (channel === 'get-products')",1800],['UI_PAYLOAD',r,"'editSaleId'",900]]){
            const pos=text.indexOf(phrase);
            console.log('SCAN',label,pos,pos<0?'':text.slice(Math.max(pos-180,0),pos+size));
          }
          JS
