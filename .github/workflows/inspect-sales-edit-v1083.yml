name: Inspect sales edit and product analytics v1.0.82
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-sales-edit-v1083.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect released application handlers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/inspect
          gh release download v1.0.82 --repo "$GITHUB_REPOSITORY" --pattern 'NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip' --dir /tmp/inspect
          echo '3ba23338aa95d487e917a79a1cc72f517e3bf528957c330efe43e20a6afcaff8  /tmp/inspect/NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip' | sha256sum -c
          unzip -q /tmp/inspect/NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip payload/app.asar -d /tmp/inspect
          echo '437ab513cd7ce6b5314b9c8c825f9d0e6efca2199598ffa7c5ed2bb3a83f318f  /tmp/inspect/payload/app.asar' | sha256sum -c
          npm install --prefix /tmp/asar --no-fund --no-audit --no-save @electron/asar@3.4.1 >/dev/null
          /tmp/asar/node_modules/.bin/asar extract /tmp/inspect/payload/app.asar /tmp/inspect/src
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/inspect/src')
          patterns={
          'renderer.js':['editSale','EditSale','editingSale','saleEdit','openSale','processSale','executeSalePayload','productAnalytics','ProductAnalytics','product-analysis','showProduct','analy','salesHistory','saleHistory'],
          'browser-bridge.js':['edit-sale','update-sale','process-sale','get-product-stats','product-analytics','get-sales','get-sale-details','sale_to_edit','db.sales','sale_id','cash_change_audit'],
          'browser-preload.js':['updateSale','editSale','getProductAnalytics','getProductStats','getSales','getSaleDetails'],
          'index.html':['تحليلات المنتج','productAnalytics','product-analytics','editSale','onclick="','productStats','salesHistory'],
          'electron-main.cjs':['update-sale','edit-sale','process-sale','get-product','get-sales'],
          }
          for name,terms in patterns.items():
           text=(p/name).read_text(encoding='utf8')
           print('###',name,'BYTES',len(text))
           for term in terms:
            start=0;hits=[]
            while True:
             i=text.lower().find(term.lower(),start)
             if i<0 or len(hits)==3:break
             hits.append(i);start=i+len(term)
            print('MARK',term,'COUNT',text.lower().count(term.lower()),'OFFSETS',hits)
            if term in ('editSale','editingSale','saleEdit','openSale','productAnalytics','ProductAnalytics','product-analysis','analy','update-sale','edit-sale','get-product-stats','product-analytics','get-sale-details','executeSalePayload','cash_change_audit'):
             for i in hits[:2]:print('SNIP',name,term,repr(text[max(i-180,0):min(i+700,len(text))]))
          PY
