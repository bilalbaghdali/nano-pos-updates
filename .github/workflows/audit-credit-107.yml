name: Audit NANO POS customer and credit checkout 107
on:
  push:
    branches: [feature/credit-customer-checkout-107]
    paths: [.github/workflows/audit-credit-107.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download verified v1.0.106
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download v1.0.106 --pattern NANO-POS-Patch-1.0.105-to-1.0.106-CASH-FASTSTART.zip --dir source
          python3 .github/scripts/audit-credit-107.py
      - name: Commit limited checkout API excerpts for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add development/trade/credit-checkout-audit-107.txt
          git commit -m 'audit: checkout customer API excerpts from official v1.0.106'
          git push origin HEAD:refs/heads/feature/credit-customer-checkout-107
