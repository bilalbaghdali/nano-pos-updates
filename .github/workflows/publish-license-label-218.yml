name: NANO POS v2.0.18 — Correct Arabic license button label
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-license-label-218.yml'
      - '.github/scripts/build-license-label-218.py'
      - '.github/scripts/publish-manifest-218.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nano-pos-license-label-v2.0.18
  cancel-in-progress: false
jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download official v2.0.17 source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path source,work | Out-Null
          $patch='NANO-POS-Patch-1.0.118-to-2.0.17-STATISTICS-CHARTS-AUTOMATIC.zip'
          gh release download v2.0.17 -R bilalbaghdali/nano-pos-updates --pattern $patch --dir source
          if($LASTEXITCODE -ne 0){throw 'Could not download official v2.0.17 patch'}
          python -c "import hashlib,zipfile; p=r'source/NANO-POS-Patch-1.0.118-to-2.0.17-STATISTICS-CHARTS-AUTOMATIC.zip'; z=zipfile.ZipFile(p); assert z.namelist()==['payload/app.asar']; assert hashlib.sha256(z.read('payload/app.asar')).hexdigest()=='ae06246d24a9f28257f6bfe17a3e4b3dbf5e9dc836201de9255ab9021cecaf21'"
          if($LASTEXITCODE -ne 0){throw 'Official v2.0.17 ASAR verification failed'}
      - name: Replace only the Arabic label and build v2.0.18
        run: |
          $ErrorActionPreference='Stop'
          python .github/scripts/build-license-label-218.py source/NANO-POS-Patch-1.0.118-to-2.0.17-STATISTICS-CHARTS-AUTOMATIC.zip NANO-POS-Patch-2.0.17-to-2.0.18-LICENSE-LABEL-FIX.zip work
          if($LASTEXITCODE -ne 0){throw 'License label patch build failed; no release will be published'}
          $jsFiles=@(Get-ChildItem work -Recurse -File | Where-Object {$_.Extension -in '.js','.cjs','.mjs'})
          foreach($f in $jsFiles){
            node --check $f.FullName
            if($LASTEXITCODE -ne 0){throw "JavaScript syntax check failed: $($f.FullName)"}
          }
      - name: Check the final ASAR and exact text change
        run: |
          $ErrorActionPreference='Stop'
          python -c "import hashlib,json,struct,zipfile; z=zipfile.ZipFile('NANO-POS-Patch-2.0.17-to-2.0.18-LICENSE-LABEL-FIX.zip'); assert z.namelist()==['payload/app.asar']; b=z.read('payload/app.asar'); m,bl,hs,n=struct.unpack_from('<4I',b); tree=json.loads(b[16:16+n]); start=8+bl; files={}; walk=lambda node,prefix='': [(files.__setitem__(prefix+k,b[start+int(e['offset']):start+int(e['offset'])+int(e['size'])]) if 'offset' in e and 'size' in e else None) if 'files' not in e else walk(e,prefix+k+'/') for k,e in node.get('files',{}).items()]; walk(tree); p=json.loads(files['package.json']); assert p['version']=='2.0.18'; alltext='\\n'.join(v.decode('utf-8','ignore') for v in files.values()); assert 'ازل الترخيص من البرنامج' in alltext; assert not any(x in alltext for x in ['إزالة الترخيص من المتصفح','ازالة الترخيص من المتصفح','أزل الترخيص من المتصفح','ازل الترخيص من المتصفح','إزالة الترخيص من هذا المتصفح','ازالة الترخيص من هذا المتصفح','أزل الترخيص من هذا المتصفح','ازل الترخيص من هذا المتصفح']); assert '__nanoCartSpeechV202' in files['renderer.js'].decode('utf-8','ignore'); assert '__nanoOperationalAnalyticsV217' in files['renderer.js'].decode('utf-8','ignore'); print('PASS: v2.0.18, new license label, no old label, base features preserved')"
          if($LASTEXITCODE -ne 0){throw 'Final ASAR audit failed'}
      - name: Prepare release manifest
        run: |
          $ErrorActionPreference='Stop'
          python .github/scripts/publish-manifest-218.py
          if($LASTEXITCODE -ne 0){throw 'Manifest build failed'}
      - name: Publish verified patch artifact to repository downloads
        run: |
          $ErrorActionPreference='Stop'
          $manifestBackup=Join-Path $env:RUNNER_TEMP 'nano-pos-update-v218.json'
          Copy-Item 'nano-pos-update.json' $manifestBackup -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if($LASTEXITCODE -ne 0){throw 'Could not fetch latest main before publishing the patch'}
          git reset --hard origin/main
          if($LASTEXITCODE -ne 0){throw 'Could not synchronize main before publishing the patch'}
          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          Copy-Item 'NANO-POS-Patch-2.0.17-to-2.0.18-LICENSE-LABEL-FIX.zip' 'downloads/NANO-POS-Patch-2.0.17-to-2.0.18-LICENSE-LABEL-FIX.zip' -Force
          git add 'downloads/NANO-POS-Patch-2.0.17-to-2.0.18-LICENSE-LABEL-FIX.zip'
          git commit -m 'Publish NANO POS v2.0.18 license label patch'
          if($LASTEXITCODE -ne 0){throw 'Could not commit v2.0.18 patch'}
          git push origin HEAD:main
          if($LASTEXITCODE -ne 0){throw 'Could not publish v2.0.18 patch to main'}
          Copy-Item $manifestBackup 'nano-pos-update.json' -Force
          $raw='https://raw.githubusercontent.com/bilalbaghdali/nano-pos-updates/main/downloads/NANO-POS-Patch-2.0.17-to-2.0.18-LICENSE-LABEL-FIX.zip'
          $verify=Join-Path $env:RUNNER_TEMP 'published-license-label-v218.zip'
          Invoke-WebRequest -Uri $raw -OutFile $verify
          if($LASTEXITCODE -ne 0){throw 'Could not verify published patch URL'}
          $publishedSha=(Get-FileHash $verify -Algorithm SHA256).Hash.ToLowerInvariant()
          $localSha=(Get-FileHash 'NANO-POS-Patch-2.0.17-to-2.0.18-LICENSE-LABEL-FIX.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($publishedSha -ne $localSha){throw 'Published patch checksum mismatch'}
      - name: Publish manifest using GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $currentSha=gh api repos/bilalbaghdali/nano-pos-updates/contents/nano-pos-update.json --jq .sha
          if($LASTEXITCODE -ne 0 -or !$currentSha){throw 'Could not read current manifest SHA'}
          $bytes=[System.IO.File]::ReadAllBytes((Resolve-Path 'nano-pos-update.json'))
          $content=[Convert]::ToBase64String($bytes)
          $body=@{message='Publish NANO POS v2.0.18 license label update';sha=$currentSha;content=$content} | ConvertTo-Json -Compress
          $bodyPath=Join-Path $env:RUNNER_TEMP 'manifest-publish.json'
          [System.IO.File]::WriteAllText($bodyPath,$body,[System.Text.UTF8Encoding]::new($false))
          gh api --method PUT repos/bilalbaghdali/nano-pos-updates/contents/nano-pos-update.json --input $bodyPath
          if($LASTEXITCODE -ne 0){throw 'Manifest publication failed'}
      - name: Verify release and automatic update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $m=Invoke-RestMethod 'https://raw.githubusercontent.com/bilalbaghdali/nano-pos-updates/main/nano-pos-update.json'
          if($m.version -ne '2.0.18' -or !$m.published){throw 'Published manifest verification failed'}
          $p=$m.patches[0]
          if($p.id -ne 'nano-pos-v118-license-label-program-v218' -or !($p.fromVersions -contains '2.0.17')){throw 'v2.0.18 license label patch missing from automatic manifest'}
          if($p.directUrl -ne 'https://raw.githubusercontent.com/bilalbaghdali/nano-pos-updates/main/downloads/NANO-POS-Patch-2.0.17-to-2.0.18-LICENSE-LABEL-FIX.zip'){throw 'Unexpected v2.0.18 patch URL'}
          $verify=Join-Path $env:RUNNER_TEMP 'published-license-label-v218-final.zip'
          Invoke-WebRequest -Uri $p.directUrl -OutFile $verify
          if($LASTEXITCODE -ne 0){throw 'Published patch URL verification failed'}
          $actual=(Get-FileHash $verify -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $p.sha256){throw 'Published manifest checksum mismatch'}
          Write-Host 'PASS: v2.0.18 patch is public and the automatic-update manifest is published.'
