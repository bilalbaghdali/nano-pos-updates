name: Publish NANO POS v1.0.82 — Live Notifications

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-notifications-v1082.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nano-pos-notifications-v1082
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and verify NANO POS v1.0.81 source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          gh release download v1.0.81 --repo "$GITHUB_REPOSITORY" \
            --pattern 'NANO-POS-Patch-1.0.80-to-1.0.81-LOCAL-STORAGE-FOLDER.zip' --dir /tmp/release
          echo '46599044eb82c93a335fa8ba4df5daab7c07a055e2ec7c44fa8dd7277c354bed  /tmp/release/NANO-POS-Patch-1.0.80-to-1.0.81-LOCAL-STORAGE-FOLDER.zip' | sha256sum -c
          unzip -q /tmp/release/NANO-POS-Patch-1.0.80-to-1.0.81-LOCAL-STORAGE-FOLDER.zip 'payload/app.asar' -d /tmp/release/base
          echo '35a864b77a94ca4948d4303904226b508e76febe5e774d6ca969594a63cabc1a  /tmp/release/base/payload/app.asar' | sha256sum -c
      - name: Apply real notification source, bell and stock-change refresh
        run: |
          set -euo pipefail
          npm install --prefix /tmp/asar-cli --no-audit --no-fund --no-save @electron/asar@3.4.1
          npm install --prefix /tmp/ui-test --no-audit --no-fund --no-save jsdom@25.0.1 css-tree@3.1.0
          ASAR=/tmp/asar-cli/node_modules/.bin/asar
          "$ASAR" extract /tmp/release/base/payload/app.asar /tmp/release/source
          for name in electron-main.cjs electron-native-preload.cjs nano-fast-pos.js nano-cash-change.js nano-local-folder.cjs nano-sales-layout.js nano-nova-desktop.css; do
            cp "/tmp/release/source/$name" "/tmp/release/original-$name"
          done
          node release/notifications-v1.0.82/apply.js /tmp/release/source
          node --check /tmp/release/source/nano-notifications.js
          node --check /tmp/release/source/browser-bridge.js
          node --check /tmp/release/source/renderer.js
          node --check release/notifications-v1.0.82/test.js
          for name in electron-main.cjs electron-native-preload.cjs nano-fast-pos.js nano-cash-change.js nano-local-folder.cjs nano-sales-layout.js nano-nova-desktop.css; do
            cmp "/tmp/release/source/$name" "/tmp/release/original-$name"
          done
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const tree=require('/tmp/ui-test/node_modules/css-tree');
          const root='/tmp/release/source/';
          const css=fs.readFileSync(root+'nano-notifications.css','utf8');
          assert(tree.parse(css,{onParseError:e=>{throw e}}).children.size>10);
          const renderer=fs.readFileSync(root+'renderer.js','utf8');
          const bridge=fs.readFileSync(root+'browser-bridge.js','utf8');
          const html=fs.readFileSync(root+'index.html','utf8');
          assert(renderer.includes('NANO_NOTIFICATIONS_182.refresh()'));
          assert(bridge.includes("if (channel === 'get-notifications')"));
          assert(!bridge.includes("|| channel === 'get-notifications') return []"));
          assert(bridge.includes('nano-pos-data-saved'));
          assert(html.includes('src="nano-notifications.js"')&&html.includes('href="nano-notifications.css"'));
          for(const id of ['notificationToggle','notificationsDropdown','notificationsContent','notifBadge','productsSection','inventorySearch'])
            assert(html.includes('id="'+id+'"'),'Missing original element '+id);
          const pkg=JSON.parse(fs.readFileSync(root+'package.json','utf8'));
          assert.equal(pkg.version,'1.0.82');
          console.log('PASS original business logic preserved and bell correctly wired');
          JS
          node release/notifications-v1.0.82/test.js /tmp/release/source
          mkdir -p /tmp/release/payload
          "$ASAR" pack /tmp/release/source /tmp/release/payload/app.asar
          node - <<'JS'
          const asar=require('/tmp/asar-cli/node_modules/@electron/asar');
          const path='/tmp/release/payload/app.asar';
          const pkg=JSON.parse(asar.extractFile(path,'package.json').toString('utf8'));
          if(pkg.version!=='1.0.82')throw Error('Incorrect release version');
          for(const file of ['nano-notifications.js','nano-notifications.css'])
            if(!asar.extractFile(path,file).length)throw Error('Missing file '+file);
          JS
          (cd /tmp/release && zip -q -6 'NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip' payload/app.asar)
          unzip -t /tmp/release/NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip
          sha256sum /tmp/release/payload/app.asar /tmp/release/NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip
      - name: Publish NANO POS v1.0.82 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.0.82 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p /tmp/release/check
            gh release download v1.0.82 --repo "$GITHUB_REPOSITORY" \
              --pattern 'NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip' --dir /tmp/release/check
            cmp /tmp/release/NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip \
              /tmp/release/check/NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip
          else
            gh release create v1.0.82 /tmp/release/NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title 'NANO POS v1.0.82 — إصلاح التنبيهات' \
              --notes 'إصلاح زر الجرس وتنبيهات نقص المخزون والصلاحية والعروض مع تحديث تلقائي وعدّاد رقمي ورابط الانتقال إلى المنتج، دون تغيير طريقة البيع.'
          fi
          gh release view v1.0.82 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'NANO-POS-Patch-1.0.81-to-1.0.82-NOTIFICATIONS-FIX.zip'
      - name: Activate verified automatic update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 release/notifications-v1.0.82/update_manifest.py
