name: NANO POS v1.0.91 - Visible Secondary Computer Login Fix
# Build from authenticated 1.0.90 release; handle the actual published login initializer and preserve the N icon.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nano-pos-visible-login-1.0.91.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nano-pos-secondary-login-visible-191
  cancel-in-progress: false

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout icon artwork
        uses: actions/checkout@v4
      - name: Generate multi-resolution Windows ICO
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow cairosvg
          mkdir -p icon-build
          python - <<'PY'
          import cairosvg
          from PIL import Image
          from pathlib import Path
          import hashlib
          source = Path('.github/assets/nano-pos-store-icon.svg')
          assert source.exists(), 'Missing N storefront artwork'
          cairosvg.svg2png(url=str(source), write_to='icon-build/NANO-POS-Icon.png', output_width=1024, output_height=1024)
          img = Image.open('icon-build/NANO-POS-Icon.png').convert('RGBA')
          img.save('icon-build/NANO-POS-Icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          icon = Image.open('icon-build/NANO-POS-Icon.ico')
          assert icon.size == (256,256), icon.size
          print('ICO sha256:',hashlib.sha256(Path('icon-build/NANO-POS-Icon.ico').read_bytes()).hexdigest())
          PY
      - name: Preserve icon resources for Windows build
        uses: actions/upload-artifact@v4
        with:
          name: nano-pos-188-icon
          path: icon-build/*
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: icon
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
      - name: Fetch generated NANO POS icon
        uses: actions/download-artifact@v4
        with:
          name: nano-pos-188-icon
          path: assets
      - name: Verify current release and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $meta=Get-Content nano-pos-update.json -Raw | ConvertFrom-Json
          if ($meta.version -ne '1.0.90' -or !$meta.published) { throw 'Published base version is not 1.0.90' }
          if (!(Test-Path 'assets\NANO-POS-Icon.ico')) { throw 'Icon not downloaded' }
          gh release view v1.0.87 --json assets | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read source release' }
          $existing=@(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query releases' }
          if ($existing -contains 'v1.0.91') { throw 'Release v1.0.91 already exists; refusing to overwrite' }
      - name: Download authentic 1.0.90 patch and build always-visible 1.0.91 login
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path download,extracted,incoming | Out-Null
          $source='NANO-POS-Patch-1.0.89-to-1.0.90-SECONDARY-LOGIN.zip'
          gh release download v1.0.90 --pattern $source --dir download
          if ($LASTEXITCODE -ne 0) { throw 'Could not download previous release' }
          $meta=Get-Content nano-pos-update.json -Raw | ConvertFrom-Json
          $sourceZip=Join-Path download $source
          if ((Get-FileHash $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $meta.patches[0].sha256) { throw 'Source ZIP SHA mismatch' }
          python .github/scripts/build-visible-login-191.py $sourceZip 'incoming/NANO-POS-Patch-1.0.90-to-1.0.91-VISIBLE-SECONDARY-LOGIN.zip' 'extracted/secondary-login-191.js'
          if ($LASTEXITCODE -ne 0) { throw 'Building login fix failed' }
          node --check 'extracted/secondary-login-191.js'
          if ($LASTEXITCODE -ne 0) { throw 'Login script syntax invalid' }
          Expand-Archive -LiteralPath 'incoming/NANO-POS-Patch-1.0.90-to-1.0.91-VISIBLE-SECONDARY-LOGIN.zip' -DestinationPath extracted
          if (!(Test-Path 'extracted/payload/app.asar')) { throw 'Patch missing app.asar' }
          Copy-Item 'extracted/payload/app.asar' 'extracted/app.asar'
      - name: Fetch Electron Windows 64-bit runtime
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path runtime-fetch | Out-Null
          Push-Location runtime-fetch
          npm init -y | Out-Null
          npm install --no-audit --no-fund --save-exact electron@38.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Electron download failed' }
          Pop-Location
          $runtime='runtime-fetch\node_modules\electron\dist'
          if (!(Test-Path "$runtime\electron.exe")) { throw 'Electron runtime missing' }
          Copy-Item -Path $runtime -Destination electron-app -Recurse
          Rename-Item 'electron-app\electron.exe' 'NANO POS.exe'
          Copy-Item 'extracted\app.asar' 'electron-app\resources\app.asar'
          Copy-Item 'assets\NANO-POS-Icon.ico' 'electron-app\NANO-POS-Icon.ico'
      - name: Embed storefront icon into NANO POS.exe
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path tools-rcedit | Out-Null
          Push-Location tools-rcedit
          npm init -y | Out-Null
          npm install --no-audit --no-fund --save-exact rcedit
          if ($LASTEXITCODE -ne 0) { throw 'Could not install rcedit' }
          @'
          const path=require('path');
          const rcedit=require('rcedit').rcedit;
          const exe=path.resolve('../electron-app/NANO POS.exe');
          const icon=path.resolve('../assets/NANO-POS-Icon.ico');
          (async()=>{
            await rcedit(exe,{
              icon,
              'file-version':'1.0.91',
              'product-version':'1.0.91',
              'version-string':{'ProductName':'NANO POS','FileDescription':'NANO POS','CompanyName':'NANO POS'}
            });
            console.log('Embedded storefront ICO into',exe);
          })().catch(err=>{console.error(err);process.exit(1)});
          '@ | Set-Content embed-icon.cjs -Encoding utf8
          node embed-icon.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Cannot embed EXE icon' }
          Pop-Location
          if (!(Test-Path 'electron-app\NANO POS.exe')) { throw 'Modified EXE is missing' }
          Add-Type -AssemblyName System.Drawing
          $icon=[System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path 'electron-app\NANO POS.exe').Path)
          if ($null -eq $icon) { throw 'Modified EXE has no Windows icon' }
          $icon.Dispose()
      - name: Compile icon-enabled NSIS full setup
        run: |
          $ErrorActionPreference='Stop'
          $nsis='C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path $nsis)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0 -and !(Test-Path $nsis)) { throw 'NSIS install failed' }
          }
          if (!(Test-Path $nsis)) { throw 'NSIS compiler missing' }
          @'
          Unicode true
          !include "MUI2.nsh"
          !include "x64.nsh"
          Name "NANO POS"
          OutFile "NANO-POS-Setup-1.0.91-x64.exe"
          Icon "assets\NANO-POS-Icon.ico"
          UninstallIcon "assets\NANO-POS-Icon.ico"
          InstallDir "$LOCALAPPDATA\Programs\NANO POS"
          InstallDirRegKey HKCU "Software\NANO POS" "InstallDir"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma
          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"
          Section "Install" SecMain
            SetShellVarContext current
            SetOutPath "$INSTDIR"
            File /r "electron-app\*"
            WriteRegStr HKCU "Software\NANO POS" "InstallDir" "$INSTDIR"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\NANO POS" "DisplayName" "NANO POS"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\NANO POS" "DisplayVersion" "1.0.91"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\NANO POS" "Publisher" "NANO POS"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\NANO POS" "InstallLocation" "$INSTDIR"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\NANO POS" "DisplayIcon" "$INSTDIR\NANO POS.exe"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\NANO POS" "UninstallString" '"$INSTDIR\Uninstall.exe"'
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            CreateDirectory "$SMPROGRAMS\NANO POS"
            CreateShortCut "$SMPROGRAMS\NANO POS\NANO POS.lnk" "$INSTDIR\NANO POS.exe" "" "$INSTDIR\NANO-POS-Icon.ico" 0
            CreateShortCut "$DESKTOP\NANO POS.lnk" "$INSTDIR\NANO POS.exe" "" "$INSTDIR\NANO-POS-Icon.ico" 0
          SectionEnd
          Section "Uninstall"
            SetShellVarContext current
            Delete "$DESKTOP\NANO POS.lnk"
            Delete "$SMPROGRAMS\NANO POS\NANO POS.lnk"
            RMDir "$SMPROGRAMS\NANO POS"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\NANO POS"
            DeleteRegKey HKCU "Software\NANO POS"
            RMDir /r "$INSTDIR"
            ; userData, databases, backups and licenses are outside $INSTDIR.
          SectionEnd
          '@ | Set-Content -Path installer.nsi -Encoding utf8
          & $nsis installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed' }
          $exe = 'NANO-POS-Setup-1.0.91-x64.exe'
          if (!(Test-Path $exe) -or (Get-Item $exe).Length -lt 20000000) { throw 'Installer missing or unexpectedly small' }
          $signature=[IO.File]::ReadAllBytes((Resolve-Path $exe).Path)[0..1]
          if ($signature[0] -ne 77 -or $signature[1] -ne 90) { throw 'Invalid Windows EXE header' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
      - name: Publish NANO POS 1.0.91 installer and patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $file='NANO-POS-Setup-1.0.91-x64.exe'
          $patch='incoming/NANO-POS-Patch-1.0.90-to-1.0.91-VISIBLE-SECONDARY-LOGIN.zip'
          if (!(Test-Path $file) -or !(Test-Path $patch)) { throw 'Required files missing' }
          gh release create v1.0.91 $file $patch --target $env:GITHUB_SHA --title 'NANO POS v1.0.91 - Visible Secondary Login Fix' --notes 'Fixes primary/secondary computer option missing from login by rendering it directly in the HTML. Keeps safe host connection checks, scrollable login, desktop N icon, business data and activation.'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release assets' }
          $assets=@(gh release view v1.0.91 --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0 -or $assets -notcontains $file -or $assets -notcontains 'NANO-POS-Patch-1.0.90-to-1.0.91-VISIBLE-SECONDARY-LOGIN.zip') { throw 'Release missing files' }
      - name: Publish live update manifest after release
        run: |
          $ErrorActionPreference='Stop'
          python .github/scripts/publish-manifest-191.py 'NANO-POS-Setup-1.0.91-x64.exe' 'incoming/NANO-POS-Patch-1.0.90-to-1.0.91-VISIBLE-SECONDARY-LOGIN.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nano-pos-update.json
          git commit -m 'Publish NANO POS 1.0.91 visible secondary login'
          if ($LASTEXITCODE -ne 0) { throw 'Manifest commit failed' }
          git push origin HEAD:refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw 'Manifest push failed' }
      - name: Archive Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NANO-POS-Setup-1.0.91-x64
          path: NANO-POS-Setup-1.0.91-x64.exe
          if-no-files-found: error
          retention-days: 30
