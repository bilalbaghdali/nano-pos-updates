name: NANO POS v1.0.112 - Publish Final Windows EXE and Patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-final-exe-112.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nano-pos-final-exe-112
  cancel-in-progress: false
jobs:
  validate_icon:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reject wrong official source and verify SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! gh release view v1.0.112 >/dev/null 2>&1 || { echo 'Release v1.0.112 already exists';exit 1; }
          mkdir -p source work icon-build
          gh release download v1.0.111 --pattern NANO-POS-Patch-1.0.110-to-1.0.111-INVOICE-FA.zip --dir source
          python3 - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          m=json.loads(Path('nano-pos-update.json').read_text())
          assert m['version']=='1.0.111' and m['published']
          p=Path('source/NANO-POS-Patch-1.0.110-to-1.0.111-INVOICE-FA.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['patches'][0]['sha256']
          with zipfile.ZipFile(p) as z:
            assert z.namelist()==['payload/app.asar']
            assert hashlib.sha256(z.read('payload/app.asar')).hexdigest()==m['patches'][0]['appAsarSha256']
          PY
      - name: Build verified v1.0.112 program and stress test data writes
        run: |
          set -euo pipefail
          python3 .github/scripts/build-stable-exe-112.py \
            source/NANO-POS-Patch-1.0.110-to-1.0.111-INVOICE-FA.zip \
            NANO-POS-Patch-1.0.111-to-1.0.112-STABILITY.zip work
          for f in browser-bridge.js nano-storage-warning-112.js electron-main.cjs renderer.js; do node --check "work/$f"; done
          cp .github/scripts/test-stable-exe-112.cjs work/
          cp .github/scripts/test-stability-ui-112.cjs work/
          cp development/invoices/test-fa-numbering-111.cjs work/
          (cd work && node test-stable-exe-112.cjs && node test-fa-numbering-111.cjs)
          (cd work && npm install --ignore-scripts --no-save jsdom@26.1.0 && node test-stability-ui-112.cjs)
      - name: Generate official multi-size Windows program icon
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow cairosvg
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image
          cairosvg.svg2png(url='.github/assets/nano-pos-store-icon.svg',write_to='icon-build/NANO-POS-Icon.png',output_width=1024,output_height=1024)
          image=Image.open('icon-build/NANO-POS-Icon.png').convert('RGBA')
          image.save('icon-build/NANO-POS-Icon.ico',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          assert Image.open('icon-build/NANO-POS-Icon.ico').size==(256,256)
          PY
      - name: Verify ASAR version and unchanged financial and license modules
        run: |
          python3 - <<'PY'
          import json,hashlib,struct,zipfile
          from pathlib import Path
          with zipfile.ZipFile('NANO-POS-Patch-1.0.111-to-1.0.112-STABILITY.zip') as z:
            assert z.namelist()==['payload/app.asar']
            b=z.read('payload/app.asar')
          magic,block,hs,n=struct.unpack_from('<4I',b)
          assert magic==4 and block==hs+4
          files=json.loads(b[16:16+n])['files']
          for name in ['browser-bridge.js','index.html','package.json','release-notes.js',
             'nano-storage-warning-112.js','nano-invoice-sequence-111.js','nano-invoice-layout-111.js',
             'nano-payment-ledger-102.js','backup-safety.cjs','electron-main.cjs','renderer.js']:
            e=files[name];blob=b[8+block+int(e['offset']):8+block+int(e['offset'])+e['size']]
            assert blob==Path('work/'+name).read_bytes(),name
            if 'integrity' in e:assert hashlib.sha256(blob).hexdigest()==e['integrity']['hash'],name
          pkg=json.loads(Path('work/package.json').read_text())
          assert pkg['version']=='1.0.112' and pkg['main']=='electron-main.cjs'
          print('PASS: exact ASAR and package version for Windows x64 setup')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nano-pos-112-tested-release-assets
          path: |
            NANO-POS-Patch-1.0.111-to-1.0.112-STABILITY.zip
            icon-build/NANO-POS-Icon.ico
            work/browser-bridge.js
            work/index.html
            work/package.json
            work/renderer.js
            work/electron-main.cjs
            work/nano-storage-warning-112.js
            work/nano-invoice-sequence-111.js
            work/nano-payment-ledger-102.js
            work/test-stable-exe-112.cjs
            work/test-stability-ui-112.cjs
            work/test-fa-numbering-111.cjs
          if-no-files-found: error
          retention-days: 30

  build_publish_windows:
    needs: validate_icon
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nano-pos-112-tested-release-assets
      - name: Re-test the exact production archive on Windows
        run: |
          $ErrorActionPreference='Stop'
          Push-Location work
          try {
            node --check browser-bridge.js
            node --check renderer.js
            node test-stable-exe-112.cjs
            if($LASTEXITCODE -ne 0){throw 'Safe persistence test failed'}
            node test-fa-numbering-111.cjs
            if($LASTEXITCODE -ne 0){throw 'Annual invoice test failed'}
            npm install --ignore-scripts --no-save jsdom@26.1.0
            if($LASTEXITCODE -ne 0){throw 'UI test dependencies failed'}
            node test-stability-ui-112.cjs
            if($LASTEXITCODE -ne 0){throw 'Storage warning UI failed'}
          } finally { Pop-Location }
      - name: Extract production app.asar with double checksum verification
        run: |
          $ErrorActionPreference='Stop'
          $metadata=Get-Content nano-pos-update.json -Raw | ConvertFrom-Json
          if($metadata.version -ne '1.0.111' -or !$metadata.published){throw 'Manifest changed during build'}
          $zip='NANO-POS-Patch-1.0.111-to-1.0.112-STABILITY.zip'
          if(!(Test-Path $zip)){throw 'Candidate ZIP missing'}
          New-Item -ItemType Directory -Force -Path extracted | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath extracted
          if(!(Test-Path 'extracted/payload/app.asar')){throw 'Missing packaged app.asar'}
          $sha=(Get-FileHash 'extracted/payload/app.asar' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha.Length -ne 64){throw 'Invalid ASAR checksum'}
          python -c "import json,struct; b=open('extracted/payload/app.asar','rb').read(); magic,block,h,n=struct.unpack_from('<4I',b); assert magic==4 and block==h+4; e=json.loads(b[16:16+n])['files']['package.json']; pkg=json.loads(b[8+block+int(e['offset']):8+block+int(e['offset'])+e['size']]); assert pkg['version']=='1.0.112'; print('Verified packaged NANO POS',pkg['version'])"
          if($LASTEXITCODE -ne 0){throw 'App package version invalid'}
      - name: Package Electron Windows x64 runtime
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path runtime-fetch | Out-Null
          Push-Location runtime-fetch
          npm init -y | Out-Null
          npm install --no-audit --no-fund --save-exact electron@38.0.0
          if($LASTEXITCODE -ne 0){throw 'Electron Windows runtime download failed'}
          Pop-Location
          $runtime='runtime-fetch\node_modules\electron\dist'
          if(!(Test-Path "$runtime\electron.exe")){throw 'Electron x64 executable missing'}
          Copy-Item -Path $runtime -Destination 'electron-app' -Recurse
          Rename-Item 'electron-app\electron.exe' 'NANO POS.exe'
          Copy-Item 'extracted\payload\app.asar' 'electron-app\resources\app.asar' -Force
          Copy-Item 'icon-build\NANO-POS-Icon.ico' 'electron-app\NANO-POS-Icon.ico'
          $hashA=(Get-FileHash 'extracted\payload\app.asar' -Algorithm SHA256).Hash
          $hashB=(Get-FileHash 'electron-app\resources\app.asar' -Algorithm SHA256).Hash
          if($hashA -ne $hashB){throw 'Packaged ASAR changed during copying'}
      - name: Embed product icon and Windows version metadata
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path tools-rcedit | Out-Null
          Push-Location tools-rcedit
          npm init -y | Out-Null
          npm install --no-audit --no-fund --save-exact rcedit
          if($LASTEXITCODE -ne 0){throw 'rcedit install failed'}
          @'
          const path=require('node:path');
          const rcedit=require('rcedit').rcedit;
          const exe=path.resolve('../electron-app/NANO POS.exe');
          const icon=path.resolve('../icon-build/NANO-POS-Icon.ico');
          (async()=>{await rcedit(exe,{icon,
            'file-version':'1.0.112','product-version':'1.0.112',
            'version-string':{'ProductName':'NANO POS',
              'FileDescription':'NANO POS','CompanyName':'NANO POS'}})
          })().catch(e=>{console.error(e);process.exit(1)});
          '@ | Set-Content embed-icon.cjs -Encoding utf8
          node embed-icon.cjs
          if($LASTEXITCODE -ne 0){throw 'Embedding icon failed'}
          Pop-Location
          Add-Type -AssemblyName System.Drawing
          $icon=[System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path 'electron-app\NANO POS.exe').Path)
          if($null -eq $icon){throw 'No valid application icon'}
          $icon.Dispose()
      - name: Build full installable NSIS Windows 64-bit EXE, preserving user data
        run: |
          $ErrorActionPreference='Stop'
          $nsis='C:\Program Files (x86)\NSIS\makensis.exe'
          if(!(Test-Path $nsis)){
            choco install nsis -y --no-progress
            if(!(Test-Path $nsis)){throw 'NSIS compiler unavailable'}
          }
          @'
          Unicode true
          !include "MUI2.nsh"
          !include "x64.nsh"
          Name "NANO POS"
          OutFile "NANO-POS-Setup-1.0.112-x64.exe"
          Icon "icon-build\NANO-POS-Icon.ico"
          UninstallIcon "icon-build\NANO-POS-Icon.ico"
          InstallDir "$LOCALAPPDATA\Programs\NANO POS"
          InstallDirRegKey HKCU "Software\NANO POS" "InstallDir"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma
          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"
          Section "Install" SecMain
            SetShellVarContext current
            SetOutPath "$INSTDIR"
            File /r "electron-app\*"
            WriteRegStr HKCU "Software\NANO POS" "InstallDir" "$INSTDIR"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\NANO POS" "DisplayName" "NANO POS"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\NANO POS" "DisplayVersion" "1.0.112"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\NANO POS" "Publisher" "NANO POS"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\NANO POS" "InstallLocation" "$INSTDIR"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\NANO POS" "DisplayIcon" "$INSTDIR\NANO POS.exe"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\NANO POS" "UninstallString" '"$INSTDIR\Uninstall.exe"'
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            CreateDirectory "$SMPROGRAMS\NANO POS"
            CreateShortCut "$SMPROGRAMS\NANO POS\NANO POS.lnk" "$INSTDIR\NANO POS.exe" "" "$INSTDIR\NANO-POS-Icon.ico" 0
            CreateShortCut "$DESKTOP\NANO POS.lnk" "$INSTDIR\NANO POS.exe" "" "$INSTDIR\NANO-POS-Icon.ico" 0
          SectionEnd
          Section "Uninstall"
            SetShellVarContext current
            Delete "$DESKTOP\NANO POS.lnk"
            Delete "$SMPROGRAMS\NANO POS\NANO POS.lnk"
            RMDir "$SMPROGRAMS\NANO POS"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\NANO POS"
            DeleteRegKey HKCU "Software\NANO POS"
            RMDir /r "$INSTDIR"
            ; IMPORTANT: userData, customer database, backups and licenses stay outside $INSTDIR.
          SectionEnd
          '@ | Set-Content installer.nsi -Encoding utf8
          & $nsis installer.nsi
          if($LASTEXITCODE -ne 0){throw 'NSIS installer compilation failed'}
          $exe='NANO-POS-Setup-1.0.112-x64.exe'
          if(!(Test-Path $exe) -or (Get-Item $exe).Length -lt 20000000){throw 'Full installer missing or implausibly small'}
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path $exe).Path)[0..1]
          if($bytes[0] -ne 77 -or $bytes[1] -ne 90){throw 'Not a Windows executable'}
          Get-FileHash $exe -Algorithm SHA256 | Format-List
      - name: Publish official EXE and internal patch together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $asset='NANO-POS-Setup-1.0.112-x64.exe'
          $patch='NANO-POS-Patch-1.0.111-to-1.0.112-STABILITY.zip'
          $assets=@(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if($LASTEXITCODE -ne 0){throw 'Cannot query releases'}
          if($assets -contains 'v1.0.112'){throw 'Refusing to overwrite existing release'}
          gh release create v1.0.112 $asset $patch --target $env:GITHUB_SHA --title 'NANO POS v1.0.112 — الإصدار المستقر النهائي Windows EXE' --notes 'وسم: تحسينات الاستقرار. نسخة Windows x64 كاملة بصيغة EXE، مع حزمة تحديث داخلية مستقلة. إصلاح التخزين العام للمنتجات والزبائن والموردين: فشل الكتابة يظهر للمستخدم ويرفض إرجاع نجاح زائف، وتُستعاد آخر حالة محفوظة. لم يتم تغيير منطق المبيعات والدفع الجزئي والديون والمخزون وترقيم FA والفواتير والطباعة أو خدمات المزامنة. التثبيت أو إزالة التطبيق لا يحذف مجلد userData أو ملفات التفعيل والنسخ الاحتياطية. اختبارات Windows/Linux لسلوك فشل التخزين والبيع المكرر وترقيم الفواتير، وتحقق من حجم وترويسة EXE وبصمات SHA256. ملف المثبت غير موقع بشهادة تجارية، ولم يتم إجراء اختبار متجر فعلي.'
          if($LASTEXITCODE -ne 0){throw 'GitHub release create failed'}
          $actual=@(gh release view v1.0.112 --json assets --jq '.assets[].name')
          if($LASTEXITCODE -ne 0){throw 'Unable to verify release'}
          if($actual -notcontains $asset -or $actual -notcontains $patch){throw 'EXE or patch missing in GitHub Release'}
      - name: Activate automatic updates and published EXE fallback
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,hashlib,datetime,zipfile
          from pathlib import Path
          path=Path('nano-pos-update.json')
          m=json.loads(path.read_text('utf8'))
          assert m['version']=='1.0.111' and m['published']
          patch=Path('NANO-POS-Patch-1.0.111-to-1.0.112-STABILITY.zip')
          exe=Path('NANO-POS-Setup-1.0.112-x64.exe')
          assert exe.read_bytes()[:2]==b'MZ'
          with zipfile.ZipFile(patch) as z:
            assert z.namelist()==['payload/app.asar']
            asar=hashlib.sha256(z.read('payload/app.asar')).hexdigest()
          base='https://github.com/bilalbaghdali/nano-pos-updates/releases'
          url=base+'/download/v1.0.112/'
          page=base+'/tag/v1.0.112'
          features={
            'ar':['نسخة تثبيت Windows 64-bit كاملة بصيغة EXE مع أيقونة NANO POS والاحتفاظ ببيانات المتجر والتفعيل.',
                  'تحسين سلامة حفظ المنتجات والزبائن والموردين: تنبيه فوري ورفض تأكيد العملية عندما يتعذر حفظها.',
                  'عدم استهلاك رقم مراجعة البيانات عند فشل الكتابة واستعادة آخر حالة محفوظة.',
                  'حماية المبيعات الجزئية والكريدي وترقيم FA والفواتير والطباعة والمزامنة دون تغيير بنيتها.'],
            'fr':['Installeur complet NANO POS Windows x64 EXE avec données et activation conservées.',
                  'Échec de sauvegarde des produits et clients signalé immédiatement, sans faux succès.',
                  'Conservation des versions des données en cas de panne d’écriture.',
                  'Ventes, crédit, numéro FA, impression et synchronisation préservés.'],
            'en':['Complete Windows x64 EXE installer preserving shop data and activation.',
                  'Fail closed on product/customer persistence errors with visible warning.',
                  'No revision increment for failed writes; restore last saved snapshot.',
                  'Maintain payments, FA invoice numbering, printing and sync.']
          }
          day=datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          m.update(version='1.0.112',published=True,releaseDate=day,
                   mandatory=False,importance='normal',features=features)
          m.setdefault('releaseHistory',{})['1.0.112']={'releaseDate':day,'features':features}
          m['patches']=[{
             'id':'nano-pos-v112-safe-saves-and-full-exe',
             'fromVersions':[f'1.0.{i}' for i in range(91,112)],
             'directUrl':url+patch.name,'pageUrl':page,
             'sha256':hashlib.sha256(patch.read_bytes()).hexdigest(),
             'appAsarSha256':asar,'fileName':patch.name,
             'sizeBytes':patch.stat().st_size,'payloadType':'app-asar'}]
          m['download']={'directUrl':url+exe.name,'pageUrl':page,
              'sha256':hashlib.sha256(exe.read_bytes()).hexdigest(),
              'fileName':exe.name}
          m['notes']={'ar':'إصدار Windows x64 EXE مستقر، تحسين حماية الحفظ ومعلومات النسخ الاحتياطي.',
             'fr':'Version complète EXE x64 et amélioration de la sécurité des sauvegardes.',
             'en':'Stable full Windows x64 EXE release with fail-closed local storage.'}
          path.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n','utf8')
          print('Manifest activated:',m['version'],'installer SHA256',m['download']['sha256'])
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Manifest generation failed'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nano-pos-update.json
          git commit -m 'publish: NANO POS 1.0.112 final Windows x64 EXE and stable patch'
          if($LASTEXITCODE -ne 0){throw 'Manifest commit failed'}
          git push origin HEAD:refs/heads/main
          if($LASTEXITCODE -ne 0){throw 'Manifest publish failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: NANO-POS-Setup-1.0.112-x64-EXE
          path: |
            NANO-POS-Setup-1.0.112-x64.exe
            NANO-POS-Patch-1.0.111-to-1.0.112-STABILITY.zip
          if-no-files-found: error
          retention-days: 30
