name: Temporary NANO POS manufacturing source review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-manufacturing-temp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the published app patch and extract manufacturing sources
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/bilalbaghdali/nano-pos-updates/releases/download/v2.0.20/NANO-POS-Patch-2.0.18-to-2.0.20-MOTHERBOARD-ID-RECOVERY.zip'
          Invoke-WebRequest -Uri $url -OutFile 'review-patch.zip'
          if(!(Test-Path 'review-patch.zip')){throw 'Release patch download missing'}
          python -c "import hashlib,zipfile; p='review-patch.zip'; z=zipfile.ZipFile(p); assert z.namelist()==['payload/app.asar']; assert hashlib.sha256(z.read('payload/app.asar')).hexdigest()=='fa6442b369caeb29c8493e807341213b67c9c906523cdd6c526d6b464cc51f37'; print('PATCH_HASH_AND_ASAR_HASH_OK')"
          if($LASTEXITCODE -ne 0){throw 'Release asset hash verification failed'}
          @'
          import json, struct, zipfile, hashlib, re, sys
          from pathlib import Path
          sys.stdout.reconfigure(encoding='utf-8', errors='replace')

          z=zipfile.ZipFile("review-patch.zip")
          raw=z.read("payload/app.asar")
          _, block, header_size, json_size = struct.unpack_from("<4I",raw)
          tree=json.loads(raw[16:16+json_size].decode("utf-8"))
          data_start=8+block
          files={}
          def walk(node,prefix=""):
              for name,ent in node.get("files",{}).items():
                  p=prefix+name
                  if "files" in ent: walk(ent,p+"/")
                  elif "offset" in ent and "size" in ent:
                      offset=data_start+int(ent["offset"])
                      files[p]=raw[offset:offset+int(ent["size"])]
          walk(tree)
          targets=[(p,b) for p,b in files.items() if any(x in p.lower() for x in ("manufacturing","pos-produce","production","recipe"))]
          print("TOTAL_ASAR_FILES",len(files))
          print("TARGET_FILES",[(p,len(b),hashlib.sha256(b).hexdigest()) for p,b in targets])
          for p,b in sorted(targets):
              if not p.lower().endswith((".js",".cjs",".mjs",".html",".css")): continue
              try: src=b.decode("utf-8")
              except UnicodeDecodeError: continue
              print("\\n===== BEGIN SOURCE: "+p+" =====")
              print(src)
              print("===== END SOURCE: "+p+" =====\\n")
          # Show un-obfuscated string tables around manufacturing-specific translation keys.
          for p,b in sorted(files.items()):
              if p.lower().endswith("translations.js"):
                  try: src=b.decode("utf-8")
                  except: continue
                  for needle in ("mfg_enable_title","reverse_order_confirm","shortage_blocks","save_recipe","standard_recipe"):
                      i=src.find(needle)
                      if i>=0: print("TRANSLATION_CONTEXT",needle,src[max(0,i-180):i+600])
          '@ | Set-Content -Path review-manufacturing.py -Encoding utf8
          python review-manufacturing.py > manufacturing-review.txt
          if($LASTEXITCODE -ne 0){throw 'Could not parse ASAR manufacturing sources'}
          Get-Content manufacturing-review.txt
