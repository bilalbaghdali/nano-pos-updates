name: Publish NANO POS v1.0.84 — Rotating Login Reminders
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-faith-rotation-v1084.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nano-pos-v1084-faith-rotation
  cancel-in-progress: false
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and validate the actual published v1.0.83 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          gh release download v1.0.83 --repo "$GITHUB_REPOSITORY" \
            --pattern 'NANO-POS-Patch-1.0.82-to-1.0.83-SALES-ANALYTICS-FAITH.zip' --dir /tmp/release
          echo '17fa67fd4313296976252d656696a5e21578f784da3bd1c0e6c0f0a155411646  /tmp/release/NANO-POS-Patch-1.0.82-to-1.0.83-SALES-ANALYTICS-FAITH.zip' | sha256sum -c
          unzip -q /tmp/release/NANO-POS-Patch-1.0.82-to-1.0.83-SALES-ANALYTICS-FAITH.zip payload/app.asar -d /tmp/release/base
          echo 'b8edf3c0491ee4f603598284305f6dcb18ce1931431fbbb9825fbd79aff2a014  /tmp/release/base/payload/app.asar' | sha256sum -c
      - name: Apply persistent six-message rotation and run regressions
        run: |
          set -euo pipefail
          npm install --prefix /tmp/asar-cli --no-audit --no-fund --no-save @electron/asar@3.4.1
          npm install --prefix /tmp/testkit --no-audit --no-fund --no-save jsdom@25.0.1
          ASAR=/tmp/asar-cli/node_modules/.bin/asar
          "$ASAR" extract /tmp/release/base/payload/app.asar /tmp/release/source
          for f in electron-main.cjs browser-bridge.js renderer.js nano-cash-change.js nano-product-analytics.js nano-faith-login.css index.html nano-notifications.js; do
            cp "/tmp/release/source/$f" "/tmp/release/original-$f"
          done
          node release/faith-rotation-v1.0.84/apply.js /tmp/release/source
          node --check /tmp/release/source/faith-items.js
          node --check /tmp/release/source/nano-faith-login.js
          node --check release/faith-rotation-v1.0.84/test.js
          for f in electron-main.cjs browser-bridge.js renderer.js nano-cash-change.js nano-product-analytics.js nano-faith-login.css index.html nano-notifications.js; do
            cmp "/tmp/release/source/$f" "/tmp/release/original-$f"
          done
          node release/faith-rotation-v1.0.84/test.js /tmp/release/source
          node - <<'JS'
          const fs=require('fs'),assert=require('assert');
          const dir='/tmp/release/source/';
          const pkg=JSON.parse(fs.readFileSync(dir+'package.json','utf8'));
          assert.equal(pkg.version,'1.0.84');
          const faith=fs.readFileSync(dir+'nano-faith-login.js','utf8');
          assert(faith.includes("localStorage.setItem(STORAGE_KEY"),'No persistent rotation');
          assert(faith.includes("if(!wasOpen||shown)return;"),'Login-only check missing');
          const html=fs.readFileSync(dir+'index.html','utf8');
          for(const name of ['faith-items.js','nano-faith-login.js','nano-faith-login.css'])
            assert(html.includes(name),'Reminder missing from UI: '+name);
          console.log('PASS complete POS logic and existing login UI remain intact');
          JS
          mkdir -p /tmp/release/payload
          "$ASAR" pack /tmp/release/source /tmp/release/payload/app.asar
          node - <<'JS'
          const asar=require('/tmp/asar-cli/node_modules/@electron/asar');
          const file='/tmp/release/payload/app.asar';
          const pkg=JSON.parse(asar.extractFile(file,'package.json').toString());
          if(pkg.version!=='1.0.84')throw Error('Incorrect packaged version');
          for(const f of ['faith-items.js','nano-faith-login.js'])if(!asar.extractFile(file,f).length)throw Error('Missing '+f);
          JS
          (cd /tmp/release && zip -q -6 'NANO-POS-Patch-1.0.83-to-1.0.84-FAITH-ROTATION.zip' payload/app.asar)
          unzip -t /tmp/release/NANO-POS-Patch-1.0.83-to-1.0.84-FAITH-ROTATION.zip
          sha256sum /tmp/release/payload/app.asar /tmp/release/NANO-POS-Patch-1.0.83-to-1.0.84-FAITH-ROTATION.zip
      - name: Publish v1.0.84 patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          file=/tmp/release/NANO-POS-Patch-1.0.83-to-1.0.84-FAITH-ROTATION.zip
          if gh release view v1.0.84 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p /tmp/release/existing
            gh release download v1.0.84 --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir /tmp/release/existing
            cmp "$file" "/tmp/release/existing/$(basename "$file")"
          else
            gh release create v1.0.84 "$file" --repo "$GITHUB_REPOSITORY" \
              --title 'NANO POS v1.0.84 — تغيير الآية أو الحديث بعد كل دخول' \
              --notes 'ست رسائل موثقة من القرآن والسنة الصحيحة، تتغير تلقائيًا بعد كل تسجيل دخول ناجح، مع حفظ ترتيب العرض حتى بعد إغلاق البرنامج. لا تغييرات على منطق البيع أو قاعدة البيانات.'
          fi
          gh release view v1.0.84 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'NANO-POS-Patch-1.0.83-to-1.0.84-FAITH-ROTATION.zip'
      - name: Activate verified automatic update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 release/faith-rotation-v1.0.84/update_manifest.py
