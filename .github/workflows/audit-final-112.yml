name: Audit NANO POS 1.0.111 for stable installer 112
on:
  push:
    branches: [feature/nano-pos-stability-exe-112]
    paths: [.github/workflows/audit-final-112.yml, .github/scripts/audit-final-112.py]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download official verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download v1.0.111 --pattern NANO-POS-Patch-1.0.110-to-1.0.111-INVOICE-FA.zip --dir source
          python3 .github/scripts/audit-final-112.py
      - name: Commit only code excerpts, no user data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add development/reviews/final-112-source-excerpts.txt
          git commit -m 'audit: authoritative stability candidate source excerpts'
          git push origin HEAD:refs/heads/feature/nano-pos-stability-exe-112
