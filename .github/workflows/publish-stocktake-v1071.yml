name: Publish NANO POS v1.0.71 desktop stocktake fix

on:
  push:
    paths:
      - .github/workflows/publish-stocktake-v1071.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nano-pos-stocktake-v1.0.71-publish
  cancel-in-progress: false

jobs:
  build-verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve and validate published v1.0.71 baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          gh release download v1.0.70 --repo "$GITHUB_REPOSITORY" \
            --pattern 'NANO-POS-Patch-1.0.69-to-1.0.70-DESKTOP-STOCKTAKE.zip' --dir /tmp/release
          echo '69efbc58edeef78da1768094066f947a19ee8389b31c55c3003c8f0752c697fd  /tmp/release/NANO-POS-Patch-1.0.69-to-1.0.70-DESKTOP-STOCKTAKE.zip' | sha256sum -c
          unzip -q /tmp/release/NANO-POS-Patch-1.0.69-to-1.0.70-DESKTOP-STOCKTAKE.zip 'payload/app.asar' -d /tmp/release/base
          echo 'a9a4ae823ebe1147ef1912cae702be392da1d5348dfad62a4be1cb4f646c9ebd  /tmp/release/base/payload/app.asar' | sha256sum -c
      - name: Restore desktop stocktake and verify handset restrictions
        run: |
          set -euo pipefail
          npm install --prefix /tmp/asar-cli --no-audit --no-fund --no-save @electron/asar@3.4.1
          ASAR=/tmp/asar-cli/node_modules/.bin/asar
          "$ASAR" extract /tmp/release/base/payload/app.asar /tmp/release/source
          node release/stocktake-v1.0.71/fix.js /tmp/release/source
          node --check /tmp/release/source/browser-bridge.js
          node --check /tmp/release/source/mobile-sync-server.cjs
          node --check /tmp/release/source/stocktake/desktop-tools.js
          mkdir -p /tmp/release/payload
          "$ASAR" pack /tmp/release/source /tmp/release/payload/app.asar
          node - <<'JS'
          const asar = require('/tmp/asar-cli/node_modules/@electron/asar');
          const pkg = JSON.parse(asar.extractFile('/tmp/release/payload/app.asar', 'package.json').toString('utf8'));
          if (pkg.version !== '1.0.71') throw new Error('Packaged version mismatch: '+pkg.version);
          const bridge = asar.extractFile('/tmp/release/payload/app.asar', 'browser-bridge.js').toString('utf8');
          if (bridge.includes('جرد الهاتف والجرد الجماعي متوقفان')) throw new Error('Desktop blocker is still present');
          if (!bridge.includes("if (channel === 'get-stocktake-sheet')")) throw new Error('Desktop inventory sheet route missing');
          JS
          (cd /tmp/release && zip -q -6 'NANO-POS-Patch-1.0.70-to-1.0.71-DESKTOP-STOCKTAKE-FIX.zip' payload/app.asar)
          unzip -t /tmp/release/NANO-POS-Patch-1.0.70-to-1.0.71-DESKTOP-STOCKTAKE-FIX.zip
          sha256sum /tmp/release/payload/app.asar /tmp/release/NANO-POS-Patch-1.0.70-to-1.0.71-DESKTOP-STOCKTAKE-FIX.zip
      - name: Publish GitHub Release v1.0.71
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.0.71 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release exists, verifying asset checksum'
            mkdir -p /tmp/release/check
            gh release download v1.0.71 --repo "$GITHUB_REPOSITORY" \
              --pattern 'NANO-POS-Patch-1.0.70-to-1.0.71-DESKTOP-STOCKTAKE-FIX.zip' --dir /tmp/release/check
            cmp /tmp/release/NANO-POS-Patch-1.0.70-to-1.0.71-DESKTOP-STOCKTAKE-FIX.zip \
              /tmp/release/check/NANO-POS-Patch-1.0.70-to-1.0.71-DESKTOP-STOCKTAKE-FIX.zip
          else
            gh release create v1.0.71 /tmp/release/NANO-POS-Patch-1.0.70-to-1.0.71-DESKTOP-STOCKTAKE-FIX.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title 'NANO POS v1.0.71 — إصلاح جرد الكمبيوتر' \
              --notes 'إصلاح منع جرد الكمبيوتر عن طريق الخطأ، مع استمرار تعطيل جرد الهاتف والجرد الجماعي.'
          fi
          gh release view v1.0.71 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -Fx 'NANO-POS-Patch-1.0.70-to-1.0.71-DESKTOP-STOCKTAKE-FIX.zip'
      - name: Enable verified automatic update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 release/stocktake-v1.0.71/update_manifest.py