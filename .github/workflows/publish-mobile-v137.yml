name: Publish latest public NANO POS Mobile APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mobile-v137.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download verified APK build artifact
        env:
          MOBILE_SOURCE_URL: ${{ secrets.MOBILE_SOURCE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 \
            --output archive.zip 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-d9f8-8211-b965-89047701ae93/raw?se=2026-10-13T17%3A45%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=185177b7-b31e-52ed-9f3d-68930ea91c28&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T08%3A36%3A41Z&ske=2026-10-14T08%3A36%3A41Z&sks=b&skv=2026-02-06&sig=WzNHCEpxNoGkZM98vSftk4iUFtFCvPRAaJpi/nYhC5o%3D'
          file archive.zip
          unzip -l archive.zip
          mkdir -p output
          unzip -o archive.zip -d output
          test -s output/NANO-POS-Mobile-v1.3.7.apk
          python3 - <<'PY'
          import zipfile
          p='output/NANO-POS-Mobile-v1.3.7.apk'
          with zipfile.ZipFile(p) as f:
            names=set(f.namelist())
            assert 'AndroidManifest.xml' in names
            assert 'classes.dex' in names
          print('Android APK archive structure validated')
          PY
      - name: Publish release and update public manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET='output/NANO-POS-Mobile-v1.3.7.apk'
          TAG='mobile-v1.3.7'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Mobile release already exists: refusing overwrite.'
            exit 1
          fi
          gh release create "$TAG" "$ASSET" \
            --title "NANO POS Mobile v1.3.7" \
            --notes "Android client with phone-responsive forms, dialogs and customer transaction screens. Note: this is a debug-signed APK; install signature may differ from your current application." \
            --prerelease
          mkdir -p verify
          gh release download "$TAG" --pattern 'NANO-POS-Mobile-v1.3.7.apk' --dir verify
          cmp "$ASSET" verify/NANO-POS-Mobile-v1.3.7.apk
          SHA="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          jq -n --arg version "1.3.7" --arg sha "$SHA" --arg url "https://github.com/bilalbaghdali/nano-pos-updates/releases/download/$TAG/NANO-POS-Mobile-v1.3.7.apk" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '{schema:1,product:"NANO POS Mobile",channel:"stable",published:true,version:$version,downloadUrl:$url,pageUrl:"https://github.com/bilalbaghdali/nano-pos-updates/releases/tag/mobile-v1.3.7",sha256:$sha,publishedAt:$date}' > mobile-latest.json
          SHAOLD="$(gh api repos/bilalbaghdali/nano-pos-updates/contents/mobile-latest.json --jq .sha)"
          CONTENT="$(base64 -w0 mobile-latest.json)"
          gh api --method PUT repos/bilalbaghdali/nano-pos-updates/contents/mobile-latest.json \
             -f message="Publish official NANO POS Mobile v1.3.7 download link" \
             -f sha="$SHAOLD" -f content="$CONTENT" >/dev/null
          echo "Published verified APK and latest version manifest."
