name: Diagnose Desktop Customer Sales and Debt v1.0.54
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-nano-v155-customer-detail.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Locate error in exact v1.0.54 packaged source
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,zipfile,json,struct,re
          url='https://github.com/bilalbaghdali/nano-pos-updates/releases/download/v1.0.54/NANO-POS-Patch-1.0.53-to-1.0.54-CUSTOMER-FETCH-FIX.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'nano-pos-desktop-debug'})
          with urllib.request.urlopen(req,timeout=180) as r:raw=r.read()
          assert hashlib.sha256(raw).hexdigest()=='91fd9cb683747b693a323f48b04142deb4ddf423999d1924ac9b02f5a80663fe'
          with zipfile.ZipFile(__import__('io').BytesIO(raw)) as z:packed=z.read('payload/app.asar')
          length=struct.unpack('<I',packed[12:16])[0]; tree=json.loads(packed[16:16+length]);start=8+struct.unpack('<I',packed[4:8])[0]
          texts={}
          def walk(obj,path=''):
            for name,item in obj['files'].items():
              filename=path+name
              if 'files' in item:walk(item,filename+'/')
              elif filename.endswith(('.js','.html','.cjs')) and not filename.startswith('node_modules/'):
                pos=start+int(item['offset']);texts[filename]=packed[pos:pos+item['size']].decode('utf-8','replace')
          walk(tree)
          print('FILE_COUNT',len(texts))
          patterns=['خطأ في جلب بيانات الزبون','عرض المبيعات والديون','مبيعات وديون','جلب بيانات الزبون','getCustomerSales','getCustomerCreditSummary','getCustomerSalesAggregated','showCustomer','customerSales','customerDebt','customer-details','customerDetails','get-customer-sales','get-customer-credit-summary']
          for term in patterns:
            hits=0
            for name,src in texts.items():
              if 'renderer.js' not in name and 'index.html' not in name and 'preload' not in name and 'bridge' not in name:continue
              pos=0
              while (i:=src.find(term,pos))!=-1 and hits<9:
                print('MATCH',repr(term),'FILE',name,'OFFSET',i,'CONTEXT',repr(src[max(0,i-350):i+650]))
                pos=i+len(term);hits+=1
            print('COUNT',repr(term),hits)
          PY
