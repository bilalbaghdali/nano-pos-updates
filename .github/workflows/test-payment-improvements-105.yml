name: NANO POS v1.0.105 - Payment Quality Tests
on:
  push:
    branches: ['feature/payment-improvements-105']
    paths:
      - '.github/assets/nano-payment-quality-105.js'
      - '.github/scripts/build-payment-improvements-105.py'
      - '.github/scripts/test-payment-bridge-105.cjs'
      - '.github/scripts/test-payment-ui-105.cjs'
      - '.github/workflows/test-payment-improvements-105.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download SHA-verified official v1.0.104
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source work
          gh release download v1.0.104 --pattern NANO-POS-Patch-1.0.103-to-1.0.104-IMPROVEMENTS.zip --dir source
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          m=json.loads(Path('nano-pos-update.json').read_text())
          assert m['version']=='1.0.104' and m['published']
          p=Path('source/NANO-POS-Patch-1.0.103-to-1.0.104-IMPROVEMENTS.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['patches'][0]['sha256']
          with zipfile.ZipFile(p) as z:
            assert z.namelist()==['payload/app.asar']
            assert hashlib.sha256(z.read('payload/app.asar')).hexdigest()==m['patches'][0]['appAsarSha256']
          PY
      - name: Build and verify checkout, invoice idempotency, backups and activation
        run: |
          set -euo pipefail
          python3 .github/scripts/build-payment-improvements-105.py \
            source/NANO-POS-Patch-1.0.103-to-1.0.104-IMPROVEMENTS.zip \
            NANO-POS-Patch-1.0.104-to-1.0.105-PAYMENT-IMPROVEMENTS.zip work
          for file in nano-payment-quality-105.js browser-bridge.js release-notes.js; do node --check "work/$file"; done
          cp .github/scripts/test-payment-bridge-105.cjs work/
          cp .github/scripts/test-payment-ui-105.cjs work/
          (cd work && node test-payment-bridge-105.cjs)
          (cd work && npm install --ignore-scripts --no-save jsdom@26.1.0 && node test-payment-ui-105.cjs)
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct,zipfile
          with zipfile.ZipFile('NANO-POS-Patch-1.0.104-to-1.0.105-PAYMENT-IMPROVEMENTS.zip') as z:
            assert z.namelist()==['payload/app.asar']
            data=z.read('payload/app.asar')
          magic,b,hs,n=struct.unpack_from('<4I',data)
          assert magic==4 and b==hs+4
          h=json.loads(data[16:16+n])['files']
          for name in ['index.html','browser-bridge.js','nano-payment-quality-105.js',
                       'nano-checkout-choice-104.js','nano-payment-ledger-102.js','package.json','release-notes.js']:
            e=h[name];payload=data[8+b+int(e['offset']):8+b+int(e['offset'])+e['size']]
            assert payload==Path('work/'+name).read_bytes()
            if 'integrity' in e:assert hashlib.sha256(payload).hexdigest()==e['integrity']['hash']
          assert json.loads(Path('work/package.json').read_text())['version']=='1.0.105'
          assert b'src="nano-split-ui-102.js"' not in Path('work/index.html').read_bytes()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nano-pos-105-candidate
          path: |
            NANO-POS-Patch-1.0.104-to-1.0.105-PAYMENT-IMPROVEMENTS.zip
            work/index.html
            work/browser-bridge.js
            work/nano-payment-quality-105.js
            work/nano-checkout-choice-104.js
            work/nano-payment-ledger-102.js
            work/release-notes.js
            work/package.json
            work/test-payment-bridge-105.cjs
            work/test-payment-ui-105.cjs
          if-no-files-found: error
  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nano-pos-105-candidate
      - name: Run full payment regression suite on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location work
          try {
            node --check nano-payment-quality-105.js
            node --check browser-bridge.js
            node test-payment-bridge-105.cjs
            if($LASTEXITCODE -ne 0){throw 'Payment business rules failed'}
            npm install --ignore-scripts --no-save jsdom@26.1.0
            if($LASTEXITCODE -ne 0){throw 'Dependencies unavailable'}
            node test-payment-ui-105.cjs
            if($LASTEXITCODE -ne 0){throw 'UI payment regression failed'}
          }finally{Pop-Location}
  unchanged_protected_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No direct business-data or activation edits
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD
          if git diff --name-only origin/main...HEAD | grep -E '^(nano-pos-update\.json|app\.asar|mobile/|database/|activation/|backup/)' ; then
            echo 'Protected business source changed' >&2;exit 1
          fi
