name: Publish NANO POS v1.0.29

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.0.29.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download v1.0.28 base patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download v1.0.28             --repo "$GITHUB_REPOSITORY"             --pattern "NANO-POS-Patch-1.0.24-to-1.0.28.zip"             --dir work
          cd work
          unzip -o NANO-POS-Patch-1.0.24-to-1.0.28.zip
          test -f payload/app.asar
          echo "01c44055ff77b969f12643d6aeb801b54b998fbefb1719b31a55490b0fe3b63f  payload/app.asar" | sha256sum -c -

      - name: Build v1.0.29 app.asar
        run: |
          cp tools/.tmp-patch-v1.0.29.py work/patch.py
          cd work
          python patch.py
          echo "555725fdf4e2fec01617ae92402ed3c3dd55b1485f5302b6f6253d34628d009d  payload/app.asar" | sha256sum -c -
          touch -t 202610071300 payload/app.asar
          zip -X -9 NANO-POS-Patch-1.0.28-to-1.0.29-PREVIEW-LANGUAGE.zip payload/app.asar
          sha256sum NANO-POS-Patch-1.0.28-to-1.0.29-PREVIEW-LANGUAGE.zip

      - name: Create release and upload patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd work
          if gh release view v1.0.29 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.29 NANO-POS-Patch-1.0.28-to-1.0.29-PREVIEW-LANGUAGE.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.0.29 NANO-POS-Patch-1.0.28-to-1.0.29-PREVIEW-LANGUAGE.zip               --repo "$GITHUB_REPOSITORY"               --target main               --title "NANO POS v1.0.29"               --notes "معاينة إلزامية قبل طباعة الفاتورة والوصل والفاتورة المبدئية، مع اختيار لغة الطباعة من داخل المعاينة (العربية / Français / English) وتحديث المعاينة فور تغيير اللغة."
          fi
