name: Publish NANO POS v1.0.77 — Fast checkout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-fast-pos-v1077.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nano-pos-fast-v1077
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve verified NANO POS v1.0.76
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          gh release download v1.0.76 --repo "$GITHUB_REPOSITORY" \
            --pattern 'NANO-POS-Patch-1.0.75-to-1.0.76-SALES-WORKSPACE.zip' --dir /tmp/release
          echo 'b1b515c3a02facb48b9fca23a7bc44742502e48113d5f5d0ca3eac260cadd5d7  /tmp/release/NANO-POS-Patch-1.0.75-to-1.0.76-SALES-WORKSPACE.zip' | sha256sum -c
          unzip -q /tmp/release/NANO-POS-Patch-1.0.75-to-1.0.76-SALES-WORKSPACE.zip 'payload/app.asar' -d /tmp/release/base
          echo 'fe5506aacdbebc9eac7c593adeb77d34cbadee524b52a579a5c9a4cd7ec10bac  /tmp/release/base/payload/app.asar' | sha256sum -c
      - name: Apply fast sales UI and run validation tests
        run: |
          set -euo pipefail
          npm install --prefix /tmp/asar-cli --no-audit --no-fund --no-save @electron/asar@3.4.1
          npm install --prefix /tmp/ui-test --no-audit --no-fund --no-save jsdom@25.0.1 css-tree@3.1.0
          ASAR=/tmp/asar-cli/node_modules/.bin/asar
          "$ASAR" extract /tmp/release/base/payload/app.asar /tmp/release/source
          cp /tmp/release/source/browser-bridge.js /tmp/release/bridge-original.js
          cp /tmp/release/source/renderer.js /tmp/release/renderer-original.js
          cp /tmp/release/source/nano-sales-layout.js /tmp/release/layout-original.js
          cp /tmp/release/source/nano-price-display.js /tmp/release/display-original.js
          node release/fast-v1.0.77/apply.js /tmp/release/source
          node --check /tmp/release/source/nano-fast-pos.js
          node --check /tmp/release/source/browser-bridge.js
          node --check /tmp/release/source/renderer.js
          cmp /tmp/release/bridge-original.js /tmp/release/source/browser-bridge.js
          cmp /tmp/release/renderer-original.js /tmp/release/source/renderer.js
          cmp /tmp/release/layout-original.js /tmp/release/source/nano-sales-layout.js
          cmp /tmp/release/display-original.js /tmp/release/source/nano-price-display.js
          node - <<'JS'
          'use strict';
          const fs=require('fs'),assert=require('node:assert/strict');
          const {JSDOM}=require('/tmp/ui-test/node_modules/jsdom');
          const csstree=require('/tmp/ui-test/node_modules/css-tree');
          const path='/tmp/release/source/';
          const css=fs.readFileSync(path+'nano-fast-pos.css','utf8');
          const cssAst=csstree.parse(css,{onParseError:e=>{throw e}});
          assert(cssAst.children.size>5,'CSS is too small');
          const src=fs.readFileSync(path+'nano-fast-pos.js','utf8');
          const html=fs.readFileSync(path+'index.html','utf8');
          assert(html.includes('src="nano-fast-pos.js"')&&html.includes('href="nano-fast-pos.css"'));
          const fixture='<section id="salesSection"><div id="posToolbar"></div><div id="cartItemsList"><button onclick="promptItemQty(0)">1</button></div><input id="posBarcodeScanInput"></section>'+
           '<div id="checkoutModal" class="hidden"><div id="checkoutTotalUI">100.00 د.ج</div><select id="checkoutPaymentMethod"><option value="cash">Cash</option></select>'+
           '<div><input id="checkoutPaidAmount" value="100.00"></div><input id="posCustomerSelect" value="42"><input id="posCustomerSearchInput">'+
           '<button id="confirm" onclick="processSale()">Confirm</button></div>';
          const dom=new JSDOM(fixture,{url:'https://localhost/',runScripts:'outside-only'});
          const w=dom.window,d=w.document;let qty=null,opened=0,warning=0,changes=0,confirmations=0;
          w.openCustomProductModal=()=>{opened++};
          w.setCartItemQty=(idx,n)=>{qty={idx,n}};
          w.updateCartUI=()=>{};
          w.checkoutCalcChange=()=>{changes++};
          w.showToast=()=>{warning++};
          d.getElementById('confirm').addEventListener('click',()=>{confirmations++});
          w.eval(src);
          d.dispatchEvent(new w.Event('DOMContentLoaded'));
          assert(d.getElementById('nanoFastScan'),'Barcode action absent');
          d.getElementById('nanoFastFree').click();assert.equal(opened,1);
          d.getElementById('nanoFastQty').click();
          const qtyInput=d.querySelector('.nano-fast-qty');
          assert(qtyInput,'Inline quantity editor absent');
          qtyInput.value='2.5';
          qtyInput.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
          assert.equal(qty?.idx,0);assert.equal(qty?.n,2.5);
          const modal=d.getElementById('checkoutModal');modal.classList.remove('hidden');
          d.getElementById('nanoSplitToggle').click();
          const cash=d.getElementById('nanoSplitCash');
          assert.equal(d.getElementById('nanoSplitPanel').hidden,false,'Split control not activated');
          cash.value='35.50';cash.dispatchEvent(new w.Event('input',{bubbles:true}));
          assert.equal(d.getElementById('checkoutPaidAmount').value,'35.50');
          assert.equal(d.getElementById('nanoSplitDebt').textContent,'64.50');
          assert(changes>0,'Original checkout calculator was not invoked');
          const confirm=d.getElementById('confirm');
          confirm.click();assert.equal(confirmations,1,'Valid checkout unexpectedly blocked');
          d.getElementById('posCustomerSelect').value='';
          confirm.click();assert.equal(confirmations,1,'Unassigned customer debt was approved');
          assert(warning>0,'Missing customer warning was not displayed');
          d.getElementById('posCustomerSelect').value='42';
          cash.value='120.00';cash.dispatchEvent(new w.Event('input',{bubbles:true}));
          confirm.click();assert.equal(confirmations,1,'Overpayment was approved by split');
          cash.value='0';cash.dispatchEvent(new w.Event('input',{bubbles:true}));
          confirm.click();assert.equal(confirmations,2,'Full debt assigned to customer should be valid');
          console.log('PASS: fast actions, inline quantity, correct split arithmetic, invalid amount and customer checks');
          JS
          node - <<'JS'
          const fs=require('fs');
          const root='/tmp/release/source/';
          const pkg=JSON.parse(fs.readFileSync(root+'package.json','utf8'));
          if(pkg.version!=='1.0.77')throw Error('Version incorrect');
          for(const text of ['function setCartItemQty(', 'function handleCheckoutPress(', 'function processSale(']){
            if(!fs.readFileSync(root+'renderer.js','utf8').includes(text))throw Error('Existing POS handler missing '+text);
          }
          JS
          mkdir -p /tmp/release/payload
          "$ASAR" pack /tmp/release/source /tmp/release/payload/app.asar
          node - <<'JS'
          const fs=require('fs'),asar=require('/tmp/asar-cli/node_modules/@electron/asar');
          const p='/tmp/release/payload/app.asar';
          const pkg=JSON.parse(asar.extractFile(p,'package.json').toString('utf8'));
          if(pkg.version!=='1.0.77')throw Error('Packaged version mismatch');
          for(const file of ['nano-fast-pos.js','nano-fast-pos.css'])if(!asar.extractFile(p,file).length)throw Error('Missing '+file);
          for(const f of [['browser-bridge.js','bridge-original.js'],['renderer.js','renderer-original.js']]){
            if(!asar.extractFile(p,f[0]).equals(fs.readFileSync('/tmp/release/'+f[1])))throw Error('Business logic altered: '+f[0]);
          }
          JS
          (cd /tmp/release && zip -q -6 'NANO-POS-Patch-1.0.76-to-1.0.77-FAST-POS.zip' payload/app.asar)
          unzip -t /tmp/release/NANO-POS-Patch-1.0.76-to-1.0.77-FAST-POS.zip
          sha256sum /tmp/release/payload/app.asar /tmp/release/NANO-POS-Patch-1.0.76-to-1.0.77-FAST-POS.zip
      - name: Publish NANO POS v1.0.77 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.0.77 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p /tmp/release/verify
            gh release download v1.0.77 --repo "$GITHUB_REPOSITORY" \
              --pattern 'NANO-POS-Patch-1.0.76-to-1.0.77-FAST-POS.zip' --dir /tmp/release/verify
            cmp /tmp/release/NANO-POS-Patch-1.0.76-to-1.0.77-FAST-POS.zip \
              /tmp/release/verify/NANO-POS-Patch-1.0.76-to-1.0.77-FAST-POS.zip
          else
            gh release create v1.0.77 /tmp/release/NANO-POS-Patch-1.0.76-to-1.0.77-FAST-POS.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title 'NANO POS v1.0.77 — نظام البيع السريع والذكي' \
              --notes 'تعزيز مسح الباركود، تعديل الكمية مباشرة داخل السلة، اختصارات سريعة، تقسيم المبلغ بين نقد مدفوع وكريدي الزبون مع التحقق؛ منطق البيع والرصيد الأصلي دون تغيير.'
          fi
          gh release view v1.0.77 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -Fx 'NANO-POS-Patch-1.0.76-to-1.0.77-FAST-POS.zip'
      - name: Activate verified automatic update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 release/fast-v1.0.77/update_manifest.py
