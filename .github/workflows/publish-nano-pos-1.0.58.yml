name: Publish NANO POS v1.0.58 Embedded Offline APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nano-pos-1.0.58.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout public update sources
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build ASAR from verified v1.0.57 and verified v1.3.7 APK
        run: |
          set -euo pipefail
          python3 build/v1.0.58/build.py
      - name: Test local APK status, binary serving and HTTP errors
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,zipfile,struct,pathlib
          root=pathlib.Path('build/v1.0.58')
          with zipfile.ZipFile(root/'NANO-POS-Patch-1.0.57-to-1.0.58-EMBEDDED-APK.zip') as z: data=z.read('payload/app.asar')
          h=json.loads(data[16:16+struct.unpack_from('<I',data,12)[0]])
          start=8+struct.unpack_from('<I',data,4)[0]
          def get(p):
            node=h
            for part in p.split('/'):node=node['files'][part]
            return data[start+int(node['offset']):start+int(node['offset'])+node['size']]
          folder=root/'verify-module'
          (folder/'downloads').mkdir(parents=True,exist_ok=True)
          (folder/'nano-embedded-apk.cjs').write_bytes(get('nano-embedded-apk.cjs'))
          (folder/'downloads'/'NANO-POS-Mobile-v1.3.7.apk').write_bytes(get('downloads/NANO-POS-Mobile-v1.3.7.apk'))
          assert b'nanoOfflineApkCard' in get('nano-mobile-offline-ui.js')
          assert b'nano-embedded-apk.cjs' in get('electron-main.cjs')
          assert b'nano-embedded-apk.cjs' in get('mobile-sync-server.cjs')
          assert b'saveEmbeddedMobileApk' in get('electron-native-preload.cjs')
          print('ASAR embedded files and Electron integration passed')
          PY
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const mod = require('./build/v1.0.58/verify-module/nano-embedded-apk.cjs');
          const digest = data => crypto.createHash('sha256').update(data).digest('hex');
          assert.equal(mod.status().available, true);
          assert.equal(mod.status().version, '1.3.7');
          assert.equal(digest(mod.readVerifiedApk()),mod.APK_SHA256);
          function test(method, url) {
            const state = {status:null,headers:null,body:null};
            const response = {
              writeHead(status,headers){state.status=status;state.headers=headers;},
              end(data){state.body=data;}
            };
            state.handled=mod.serve({method,url},response);
            return state;
          }
          const get=test('GET','/nano-mobile.apk');
          assert.equal(get.handled,true);
          assert.equal(get.status,200);
          assert.equal(digest(get.body),mod.APK_SHA256);
          assert.equal(get.headers['Content-Disposition'],'attachment; filename="'+mod.APK_NAME+'"');
          const head=test('HEAD','/nano-mobile.apk');
          assert.equal(head.status,200);
          assert.equal(head.body,undefined);
          const info=test('GET','/api/nano-mobile-apk');
          assert.equal(info.status,200);
          assert.equal(JSON.parse(info.body.toString()).sha256,mod.APK_SHA256);
          assert.equal(test('POST','/nano-mobile.apk').status,405);
          assert.equal(test('GET','/backups/secret.json').handled,false);
          console.log('Local APK HTTP/HEAD/metadata/integrity/security tests passed');
          JS
      - name: Confirm file change scope and release metadata
        run: |
          python3 - <<'PY'
          import json,pathlib
          r=pathlib.Path('build/v1.0.58')
          meta=json.loads((r/'build-result.json').read_text())
          manifest=json.loads((r/'nano-pos-update-v158.json').read_text())
          assert meta['dataFilesModified'] is False
          assert 'renderer.js' not in meta['changedFiles']
          assert 'mobile/www/renderer.js' not in meta['changedFiles']
          assert meta['apkVersion']=='1.3.7'
          assert manifest['version']=='1.0.58'
          assert manifest['patches'][0]['sha256']==meta['sha256']
          print('Published patch scope and SHA manifest validated')
          PY
      - name: Publish optional NANO POS v1.0.58 update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET='build/v1.0.58/NANO-POS-Patch-1.0.57-to-1.0.58-EMBEDDED-APK.zip'
          if gh release view v1.0.58 >/dev/null 2>&1; then
             echo 'Existing release must not be overwritten.'; exit 1
          fi
          gh release create v1.0.58 "$ASSET" --target main \
            --title 'NANO POS v1.0.58 — Android APK Included for Offline Download' \
            --notes 'Optional v1.0.58 Windows desktop update based on the SHA-verified v1.0.57. Bundles an SHA-verified NANO POS Mobile v1.3.7 Android APK inside the desktop app.asar. Enables saving APK from Windows, copying a LAN/Tailscale mobile-server URL, and retrieving APK without Internet from the running primary PC. Sales, products, customer debts, purchases, backups, stored data and activation are unchanged. APK is debug signed; replacement of an existing installation with a different signature may fail. Validate with your Windows shop PC and Android phone before deployment.'
      - name: Verify remote update archive checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh release download v1.0.58 --pattern 'NANO-POS-Patch-1.0.57-to-1.0.58-EMBEDDED-APK.zip' --dir verified
          EXPECTED="$(python3 -c 'import json;print(json.load(open("build/v1.0.58/build-result.json"))["sha256"])')"
          ACTUAL="$(sha256sum verified/NANO-POS-Patch-1.0.57-to-1.0.58-EMBEDDED-APK.zip | cut -d' ' -f1)"
          test "$EXPECTED" = "$ACTUAL"
      - name: Publish cloud update manifest only after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="$(gh api repos/bilalbaghdali/nano-pos-updates/contents/nano-pos-update.json --jq .sha)"
          CONTENT="$(base64 -w0 build/v1.0.58/nano-pos-update-v158.json)"
          gh api --method PUT repos/bilalbaghdali/nano-pos-updates/contents/nano-pos-update.json \
            -f message='Publish NANO POS Desktop v1.0.58 offline APK update' \
            -f sha="$CURRENT" -f content="$CONTENT" >/dev/null
      - name: Keep build verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: nano-pos-v1.0.58-verified-metadata
          path: build/v1.0.58/build-result.json
          retention-days: 30
