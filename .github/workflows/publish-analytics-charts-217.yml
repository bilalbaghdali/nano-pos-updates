name: NANO POS v2.0.17 — Automatic Statistics Charts for Cash, Inventory, Sales and Purchases (build and publish without manual ZIP upload)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-analytics-charts-217.yml'
      - '.github/scripts/build-analytics-dashboard-217.py'
      - '.github/scripts/publish-manifest-217.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nano-pos-release-v2.0.17
  cancel-in-progress: false
jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify stable v1.0.118 base and avoid duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content nano-pos-update.json -Raw | ConvertFrom-Json
          if(!$manifest.published){throw 'Update manifest must be published'}
          gh release view v2.0.17 -R bilalbaghdali/nano-pos-updates *> $null
          if($LASTEXITCODE -eq 0){Write-Host 'Release v2.0.17 exists; asset will be refreshed after the build.'}
          New-Item -ItemType Directory -Force -Path source,work | Out-Null
          $baseName='NANO-POS-Patch-1.0.117-to-1.0.118-SUPPORT-ALIGNMENT.zip'
          gh release download v1.0.118 -R bilalbaghdali/nano-pos-updates --pattern $baseName --dir source
          if($LASTEXITCODE -ne 0){throw 'Could not download official v1.0.118 base patch'}
          $base="source\\$baseName"
          python -c "import zipfile,hashlib; z=zipfile.ZipFile(r'$base'); assert z.namelist()==['payload/app.asar']; assert hashlib.sha256(z.read('payload/app.asar')).hexdigest()=='48552f35646194927d6765963110dbeb91d49bf19accfbd383371d74167e0a6a'"
          if($LASTEXITCODE -ne 0){throw 'Base ASAR integrity check failed'}
      - name: Build v2.0.17 and run syntax and archive checks
        run: |
          $ErrorActionPreference='Stop'
          python .github/scripts/build-analytics-dashboard-217.py source/NANO-POS-Patch-1.0.117-to-1.0.118-SUPPORT-ALIGNMENT.zip NANO-POS-Patch-1.0.118-to-2.0.17-STATISTICS-CHARTS-AUTOMATIC.zip work
          if($LASTEXITCODE -ne 0){throw 'Patch builder failed'}
          node --check work/renderer.js
          if($LASTEXITCODE -ne 0){throw 'Renderer syntax check failed'}
          python -c "import zipfile,struct,json; z=zipfile.ZipFile('NANO-POS-Patch-1.0.118-to-2.0.17-STATISTICS-CHARTS-AUTOMATIC.zip'); assert z.namelist()==['payload/app.asar']; b=z.read('payload/app.asar'); m,bl,hs,n=struct.unpack_from('<4I',b); f=json.loads(b[16:16+n])['files']; d=8+bl; e=f['package.json']; p=json.loads(b[d+int(e['offset']):d+int(e['offset'])+e['size']]); assert p['version']=='2.0.17'; e=f['renderer.js']; s=b[d+int(e['offset']):d+int(e['offset'])+e['size']].decode(); assert '__nanoCartSpeechV202' in s and 'SpeechSynthesisUtterance' in s and '__nanoOperationalAnalyticsV217' in s and 'nanoChartSalesPurchases' in s and 'nanoChartCashSession' in s and 'nanoChartStockCategories' in s and 'nanoChartPurchaseTrend' in s and 'nanoChartInventoryValue' in s and 'nano-pos-data-saved' in s and '__nanoPrayer' not in s and 'api.aladhan.com' not in s and 'مواقيت الصلاة' not in s and 'currentUser is not defined' not in s; print('PASS v2.0.17: operational charts, automatic refresh, spoken cart prices and no prayer feature')"
          if($LASTEXITCODE -ne 0){throw 'Final ASAR audit failed'}
          if(!(Select-String -Path work/renderer.js -Pattern '__nanoOperationalAnalyticsV217' -Quiet)){throw 'Operational analytics charts missing'}
          if(!(Select-String -Path work/renderer.js -Pattern 'nanoChartPurchaseTrend' -Quiet)){throw 'Sales/purchase movement chart missing'}
          if(!(Select-String -Path work/renderer.js -Pattern 'nano-pos-data-saved' -Quiet)){throw 'Automatic saved-data refresh hook missing'}
      - name: Prepare v2.0.17 manifest with exact patch hashes
        run: |
          $ErrorActionPreference='Stop'
          python .github/scripts/publish-manifest-217.py
          if($LASTEXITCODE -ne 0){throw 'Manifest preparation failed'}
      - name: Create release and upload generated patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view v2.0.17 -R bilalbaghdali/nano-pos-updates *> $null
          if($LASTEXITCODE -ne 0){
            gh release create v2.0.17 NANO-POS-Patch-1.0.118-to-2.0.17-STATISTICS-CHARTS-AUTOMATIC.zip -R bilalbaghdali/nano-pos-updates --target $env:GITHUB_SHA --title 'NANO POS v2.0.17 — إحصائيات ذكية' --notes 'إحصائيات ذكية: مخططات دائرية وأعمدة لحركة الصندوق والمخزون والمبيعات والمشتريات والمصاريف، ومقارنة حركة البيع والشراء عبر الزمن. تتحدث الرسوم بحسب الفترة المحددة وبعد العمليات والمزامنة. الحفاظ على النسخة المستقرة 1.0.118 ونطق سعر المنتج وإزالة مواقيت الصلاة؛ دون تعديل قاعدة بيانات المتجر أو ملفات النسخ الاحتياطي.'
            if($LASTEXITCODE -ne 0){throw 'GitHub release creation failed'}
          }
          gh release upload v2.0.17 NANO-POS-Patch-1.0.118-to-2.0.17-STATISTICS-CHARTS-AUTOMATIC.zip -R bilalbaghdali/nano-pos-updates --clobber
          if($LASTEXITCODE -ne 0){throw 'GitHub release asset upload failed'}
          gh release edit v2.0.17 -R bilalbaghdali/nano-pos-updates --title 'NANO POS v2.0.17 — إحصائيات ذكية' --notes 'إحصائيات ذكية: مخططات دائرية وأعمدة لحركة الصندوق والمخزون والمبيعات والمشتريات والمصاريف، ومقارنة حركة البيع والشراء عبر الزمن. تتحدث الرسوم بحسب الفترة المحددة وبعد العمليات والمزامنة. الحفاظ على النسخة المستقرة 1.0.118 ونطق سعر المنتج وإزالة مواقيت الصلاة؛ دون تعديل قاعدة بيانات المتجر أو ملفات النسخ الاحتياطي.'
          if($LASTEXITCODE -ne 0){throw 'GitHub release metadata update failed'}
      - name: Publish v2.0.17 manifest only after release asset exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          # Publish the generated manifest through GitHub's contents API to avoid shallow-clone rebase conflicts.
          $ErrorActionPreference='Stop'
          $currentSha=gh api repos/bilalbaghdali/nano-pos-updates/contents/nano-pos-update.json --jq .sha
          if($LASTEXITCODE -ne 0 -or !$currentSha){throw 'Could not read current manifest SHA'}
          $bytes=[System.IO.File]::ReadAllBytes((Resolve-Path 'nano-pos-update.json'))
          $content=[Convert]::ToBase64String($bytes)
          $body=@{message='Publish NANO POS 2.0.17 automatic update manifest';sha=$currentSha;content=$content} | ConvertTo-Json -Compress
          $bodyPath=Join-Path $env:RUNNER_TEMP 'manifest-publish.json'
          [System.IO.File]::WriteAllText($bodyPath,$body,[System.Text.UTF8Encoding]::new($false))
          gh api --method PUT repos/bilalbaghdali/nano-pos-updates/contents/nano-pos-update.json --input $bodyPath
          if($LASTEXITCODE -ne 0){throw 'GitHub Contents API manifest publication failed'}
      - name: Verify published release and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view v2.0.17 -R bilalbaghdali/nano-pos-updates
          $m=Invoke-RestMethod 'https://raw.githubusercontent.com/bilalbaghdali/nano-pos-updates/main/nano-pos-update.json'
          if($m.version -ne '2.0.17' -or !$m.published){throw 'Published manifest verification failed'}
          if(!($m.patches | Where-Object {$_.id -eq 'nano-pos-v118-automatic-operational-charts-v217'})){throw 'Published patch missing from manifest'}
          $p=$m.patches[0]
          if($p.id -ne 'nano-pos-v118-automatic-operational-charts-v217' -or !($p.fromVersions -contains '2.0.16') -or !($p.fromVersions -contains '1.0.34')){throw 'Universal statistics patch is not first or supported-version coverage is incomplete'}
          Write-Host 'PASS: v2.0.17 statistics charts release asset and automatic-update manifest are published.'
