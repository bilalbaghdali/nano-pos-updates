name: Publish verified NANO POS 1.0.37 patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nano-pos-1.0.37.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4
      - name: Reconstruct and validate 1.0.37 update
        run: python3 build/v1.0.37/rebuild_patch.py
      - name: Publish optional update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET='NANO-POS-Patch-1.0.36-to-1.0.37-MEGA-LOGIN.zip'
          if gh release view v1.0.37 >/dev/null 2>&1; then
            gh release upload v1.0.37 "$ASSET" --clobber
          else
            gh release create v1.0.37 "$ASSET" --target main --title 'NANO POS v1.0.37 — MEGA Account Login' --notes 'Optional update from v1.0.36. Adds MEGA email/password and optional MFA fields beside backup controls. On successful MEGAcmd session login it uploads the latest verified backup immediately and enables hourly backups. Existing MEGAcmd session persists across launches; password and one-time code are never stored in NANO POS. MEGAcmd installation required. This integration has automated tests but Windows login through MEGAcmd Shell stdin still requires real-device validation. Back up data before installing.'
          fi
      - name: Verify the published Release checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          gh release download v1.0.37 --pattern 'NANO-POS-Patch-1.0.36-to-1.0.37-MEGA-LOGIN.zip' --dir verified
          EXPECTED="$(python3 -c 'import json;print(json.load(open("build-result.json"))["sha256"])')"
          ACTUAL="$(sha256sum verified/NANO-POS-Patch-1.0.36-to-1.0.37-MEGA-LOGIN.zip | cut -d' ' -f1)"
          test "$EXPECTED" = "$ACTUAL"
      - name: Archive asset metadata
        uses: actions/upload-artifact@v4
        with:
          name: nano-pos-v1.0.37-release-metadata
          path: build-result.json
