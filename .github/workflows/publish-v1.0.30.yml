name: Publish NANO POS v1.0.30

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.0.30.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download v1.0.29 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download v1.0.29 --repo "$GITHUB_REPOSITORY" --pattern "NANO-POS-Patch-1.0.28-to-1.0.29-PREVIEW-LANGUAGE.zip" --dir work
          cd work
          unzip -o NANO-POS-Patch-1.0.28-to-1.0.29-PREVIEW-LANGUAGE.zip
          test -f payload/app.asar
          echo "555725fdf4e2fec01617ae92402ed3c3dd55b1485f5302b6f6253d34628d009d  payload/app.asar" | sha256sum -c -

      - name: Build professional print-language update
        run: |
          echo '' | base64 -d | gunzip > build.py
          python build.py
          mv work/payload/app-v1.0.30.asar work/payload/app.asar
          echo "063758a883bb5b69ce09f042c234f818b4a784166f545f16778d9c6dd894506c  work/payload/app.asar" | sha256sum -c -
          cd work
          touch -t 202610071405 payload/app.asar
          zip -X -9 NANO-POS-Patch-1.0.29-to-1.0.30-PRO-PRINT-LANGUAGE.zip payload/app.asar
          sha256sum NANO-POS-Patch-1.0.29-to-1.0.30-PRO-PRINT-LANGUAGE.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd work
          if gh release view v1.0.30 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.30 NANO-POS-Patch-1.0.29-to-1.0.30-PRO-PRINT-LANGUAGE.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.0.30 NANO-POS-Patch-1.0.29-to-1.0.30-PRO-PRINT-LANGUAGE.zip               --repo "$GITHUB_REPOSITORY" --target main --title "NANO POS v1.0.30"               --notes "نظام طباعة احترافي متعدد اللغات: قالب عربي RTL مستقل، قالب فرنسي LTR مستقل، تحديث شكل الفاتورة فور تغيير لغة الطباعة، تحسين الوصل والفاتورة المبدئية، ودعم English للفاتورة المبدئية."
          fi
